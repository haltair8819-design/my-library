<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면이 뜨기 전에 디자인 · 밝기 · 포인트 색 먼저 (깜빡임 없이) -->
<script>(function(){var d=document.documentElement,t='manuscript',m='light';try{t=localStorage.getItem('theme')||t;m=localStorage.getItem('mode')||m}catch(e){}
d.dataset.theme=t;d.dataset.mode=m==='dark'?'dark':'light';
try{var c=localStorage.getItem('accent');if(c){var k=m==='dark';d.style.setProperty('--accent',k?'color-mix(in srgb, '+c+' 62%, white)':c);d.style.setProperty('--accent-soft',k?'color-mix(in srgb, '+c+' 30%, #15161a)':'color-mix(in srgb, '+c+' 13%, white)')}}catch(e){}})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 서재</title>
<meta name="theme-color" content="#F2F3EF">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
