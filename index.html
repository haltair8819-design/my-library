<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>(function(){var d=document.documentElement,t='manuscript',m='system';try{t=localStorage.getItem('theme')||t;m=localStorage.getItem('mode')||m}catch(e){}
d.dataset.theme=t;d.dataset.mode=(m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 서재</title>
<meta name="theme-color" content="#F2F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --paper:#F6F2EA; --card:#FFFDF8; --ink:#24211D; --sub:#6F6A61; --faint:#A39D92;
  --line:#E3DCCF; --accent:#3D5A4C; --accent-soft:#E3EBE5; --warn:#A5442F;
  --quote:#2C3B33; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.05);
}
html[data-mode="dark"]{ --paper:#171614; --card:#211F1C; --ink:#ECE7DE; --sub:#B0A99D; --faint:#7C766C;
    --line:#34302A; --accent:#8DB5A0; --accent-soft:#26332C; --warn:#E08A72; --quote:#D9E6DE;
    --shadow:none; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
html[data-mode="dark"]{color-scheme:dark}
body{font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:150px}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* 헤더 */
header{padding:22px 0 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.02em}
.stats{display:flex;gap:18px;margin:14px 0 4px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub)}

/* 검색 · 필터 */
.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-mode="dark"] .chip.on{color:#10140F}

/* 책 목록 */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.book{display:flex;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;cursor:pointer;box-shadow:var(--shadow)}
.book:active{transform:scale(.995)}
.spine{width:46px;min-height:66px;border-radius:4px 7px 7px 4px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif KR',serif;font-size:12px;color:rgba(255,255,255,.92);writing-mode:vertical-rl;letter-spacing:.06em;
  overflow:hidden;padding:6px 0;box-shadow:inset 3px 0 0 rgba(0,0,0,.12)}
.spine img{width:100%;height:100%;object-fit:cover;writing-mode:horizontal-tb}
.binfo{flex:1;min-width:0}
.btitle{font-weight:650;font-size:15.5px;line-height:1.35;margin:1px 0 2px;letter-spacing:-.01em}
.bauthor{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:12px;color:var(--faint)}
.badge{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.reading{background:#F4E7CF;color:#8A5A12}
html[data-mode="dark"] .badge.reading{background:#3A3020;color:#E6C58A}
.group-label{font-size:12.5px;color:var(--sub);font-weight:600;margin:18px 2px 2px}
.empty{color:var(--faint);text-align:center;padding:40px 0;font-size:14px}

/* 책 상세 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.iconbtn{border:0;background:none;padding:8px;margin:-8px;cursor:pointer;color:var(--sub);font-size:15px}
.detail-head{display:flex;gap:16px;margin:10px 0 16px}
.detail-head .spine{width:72px;min-height:104px;font-size:14px}
.dtitle{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:600;line-height:1.35;margin:0 0 4px;letter-spacing:-.02em}
.dauthor{color:var(--sub);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid div{background:var(--card);padding:10px 8px;text-align:center}
.grid b{display:block;font-size:14px;font-weight:650}
.grid span{font-size:11.5px;color:var(--faint)}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.actions{display:flex;gap:8px;margin:12px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-mode="dark"] .btn.primary{color:#10140F}
.btn.danger{color:var(--warn)}
.btn.grow{flex:1}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 8px}
.sec-head h2{font-size:16px;margin:0}
.snip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow)}
.snip:active{transform:scale(.997)}
.stitle{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--accent);margin:0 0 9px;line-height:1.45}
.snip.memo .stitle{color:var(--sub)}
.snip.quote .txt{font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.75;color:var(--quote);border-left:3px solid var(--accent);padding-left:12px}
.snip.thought .txt{font-size:14.5px;color:var(--ink);padding-left:15px;position:relative}
.snip.thought .txt:before{content:'ㄴ';position:absolute;left:0;color:var(--faint)}
.snip.memo .txt{font-size:14px;color:var(--sub)}
.snip.memo{border-style:dashed;box-shadow:none}
.txt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.smeta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--faint);margin-top:9px;padding-left:15px}
.smeta .pg{font-weight:600;color:var(--sub)}
.kw{color:var(--accent)}

/* 시트(입력 창) */
.backdrop{position:fixed;inset:0;background:rgba(20,16,10,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media (min-width:800px){.backdrop{align-items:center}.sheet{border-radius:18px;max-width:620px}}
.sheet h3{margin:0 0 14px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:550}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:140px;resize:vertical;line-height:1.65}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{white-space:nowrap;flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;color:var(--sub);font-weight:550}
.seg button.on{background:var(--accent);color:#fff}
html[data-mode="dark"] .seg button.on{color:#10140F}
.suggest{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.suggest .chip{font-size:12px;padding:3px 10px}
.sheet .actions{margin-top:20px}

/* 책 검색 */
.al-box{display:flex;gap:8px}
.al-box .field{flex:1}
.al-res{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:46vh;overflow:auto}
.al-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.al-item:hover{border-color:var(--accent)}
.al-item img{width:40px;height:58px;object-fit:cover;border-radius:3px;background:var(--line);flex:none}
.al-item b{display:block;font-size:14px;line-height:1.35}
.al-item span{font-size:12px;color:var(--sub)}
.al-msg{font-size:13px;color:var(--faint);padding:8px 2px}
.cover-pick{display:flex;gap:12px;align-items:center;margin:12px 0 2px;padding:10px;border-radius:10px;background:var(--accent-soft)}
.cover-pick img{width:44px;height:64px;object-fit:cover;border-radius:3px}
.cover-pick span{font-size:12.5px;color:var(--sub)}
.divider{height:1px;background:var(--line);margin:16px 0 4px}

/* 하단 메뉴 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:160px;border:0;background:none;padding:8px 0 7px;font-size:11.5px;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.on{color:var(--accent);font-weight:650}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view-head{padding:22px 0 6px}
.view-head p{margin:6px 0 0;color:var(--sub);font-size:13.5px}

/* 그물망 */
:root{--n-book:#2a78d6;--n-kw:#eb6834;--n-au:#1baf7a;--n-cat:#eda100}
html[data-mode="dark"]{--n-book:#3987e5;--n-kw:#d95926;--n-au:#199e70;--n-cat:#c98500}
.g-wrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px;touch-action:none}
#g-canvas{display:block;width:100%;height:min(62vh,560px);cursor:grab}
#g-canvas.dragging{cursor:grabbing}
.g-tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.g-tools button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:17px;cursor:pointer;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:11px;height:11px}
.lg-book{background:var(--n-book);border-radius:2px;width:9px!important;height:12px!important}
.lg-kw{background:var(--n-kw);border-radius:50%}
.lg-au{background:var(--n-au);transform:rotate(45deg) scale(.82)}
.lg-cat{width:0!important;height:0!important;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--n-cat)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.5}
.kw-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kw-chips .chip b{font-weight:650;color:var(--ink);margin-left:3px}
#g-info{margin-top:14px}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.info-card h3{margin:0 0 4px;font-size:16px}
.info-card .sub{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.mini{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;cursor:pointer}
.mini b{display:block;font-size:13.5px;font-weight:600}
.mini span{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.mini em{font-style:normal;font-size:11.5px;color:var(--faint)}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tile span{font-size:12px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-top:12px}
.panel h3{margin:0 0 12px;font-size:14.5px}
.panel h3 small{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;position:relative}
.vbar .fill{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.vbar .val{font-size:11px;color:var(--sub);margin-bottom:3px}
.vbar:hover .fill,.vbar.on .fill{filter:brightness(1.15)}
.vlabels{display:flex;gap:6px;margin-top:5px}
.vlabels span{flex:1;text-align:center;font-size:10.5px;color:var(--faint);white-space:nowrap;letter-spacing:-.03em}
.hbar{display:grid;grid-template-columns:minmax(70px,32%) 1fr 30px;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px}
.hbar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hbar .track{height:12px}
.hbar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hbar .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.hbar:hover .fill,.hbar.on .fill{filter:brightness(1.15)}
.drill{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6;min-height:1em}
.drill a{color:var(--accent);cursor:pointer;text-decoration:none}
.facts{display:grid;grid-template-columns:1fr;gap:8px}
.fact{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;border-top:1px solid var(--line);padding-top:8px;cursor:pointer}
.fact:first-child{border-top:0;padding-top:0}
.fact span{color:var(--sub);white-space:nowrap}
.fact b{font-weight:600;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.two .panel{margin-top:12px}

/* AI 비서 */
.ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.msg{max-width:92%;line-height:1.65;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;white-space:pre-wrap}
html[data-mode="dark"] .msg.user{color:#10140F}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 15px}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin-bottom:0}
.msg.bot ul,.msg.bot ol{margin:4px 0 8px;padding-left:20px}
.msg.bot li{margin:2px 0}
.msg.err{border-color:var(--warn);color:var(--warn)}
.cite{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 5px;margin:0 1px;cursor:pointer;vertical-align:1px}
.sources{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sources button{border:0;background:none;text-align:left;padding:2px 0;font-size:12.5px;color:var(--sub);cursor:pointer;line-height:1.45}
.sources button b{color:var(--accent);margin-right:5px}
.thinking{color:var(--faint)}
.thinking:after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.suggest-q{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.suggest-q button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:14px}
.suggest-q button:hover{border-color:var(--accent)}
.tool{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:12px;padding:11px 14px;margin-top:14px;font-size:13.5px}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:14;background:var(--paper);border-top:1px solid var(--line);padding:9px 0}
.composer .wrap{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:140px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;line-height:1.45}
.composer textarea:focus{border-color:var(--accent)}
.composer .btn{height:44px}
body.ai-mode{padding-bottom:230px}
.kw-ai{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:0 0 0 8px}

/* 추가 기능 */
.brand .iconbtn{margin:0}
.scan-pick{display:flex;gap:8px;flex-wrap:wrap}
.scan-pick .btn,.actions label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.scan-page{border-top:1px solid var(--line);padding:12px 0 4px}
.scan-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;line-height:1.5}
.scan-head img,.scan-ph{width:52px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--accent-soft);flex:none}
.scan-seg{margin-bottom:10px}
.scan-chunk{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.scan-chunk.off{opacity:.45}
.scan-chunk .field{margin-top:6px}
.scan-chunk textarea.field{font-family:'Noto Serif KR',serif;line-height:1.7;min-height:110px}
.scan-title{font-weight:600}
.scan-row{display:flex;gap:8px}.scan-row .field:first-child{max-width:150px}
.scan-on{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.brand-r{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:nowrap}
.sync.err{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.sync.quiet{background:none;color:var(--faint);cursor:default}
body{padding-top:env(safe-area-inset-top)}
.goal{margin:12px 0 2px;cursor:pointer}
.goal .gl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.goal .gl b{color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.today{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;margin:8px 0 4px;box-shadow:var(--shadow)}
.today .lb{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.today .lb button{border:0;background:none;color:var(--sub);font-size:12.5px;cursor:pointer;padding:2px 0}
.today .tx{font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.75;color:var(--quote);cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:keep-all}
.today .mt{font-size:12px;color:var(--faint);margin-top:8px}
.due{background:#FBEBE7;color:#8A3220;border-radius:12px;padding:10px 14px;font-size:13px;margin:8px 0 2px;line-height:1.6}
html[data-mode="dark"] .due{background:#3A221C;color:#F0B4A4}
.due a{color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.badge.due-soon{background:#F4E7CF;color:#8A5A12}
.badge.due-late{background:#FBEBE7;color:#A5442F}
html[data-mode="dark"] .badge.due-late{background:#3A221C;color:#F0B4A4}
.mini-bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px;max-width:220px}
.mini-bar i{display:block;height:100%;background:var(--accent)}
.stars{color:#C9962B;letter-spacing:1px}
.res-head{font-size:12.5px;color:var(--sub);font-weight:600;margin:20px 2px 6px}
.hit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;margin-bottom:8px}
.hit .ht{font-weight:650;font-size:14px;margin-bottom:3px}
.hit .hx{font-size:13.5px;color:var(--ink);line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.hit .hm{font-size:12px;color:var(--faint);margin-top:5px}
mark{background:#F6E3A1;color:inherit;border-radius:3px;padding:0 1px}
html[data-mode="dark"] mark{background:#5A4A1A}
.snip.flash{outline:2px solid var(--accent);outline-offset:2px}
.panel2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:12px}
.panel2 h4{margin:0 0 8px;font-size:13.5px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .field{width:auto;flex:1;min-width:100px}
.small{font-size:12.5px;color:var(--sub)}
.star-pick{display:flex;gap:4px;font-size:30px;color:var(--line);cursor:pointer;margin:6px 0}
.star-pick span.on{color:#C9962B}
.kw-list{max-height:52vh;overflow:auto;margin-top:10px}
.kw-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.kw-row span{color:var(--faint);font-size:12.5px}
.report{display:flex;flex-direction:column;gap:12px}
.report .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report .big div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.report .big b{display:block;font-size:24px}
.report .big span{font-size:12px;color:var(--sub)}
.report .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.report .card h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
.report .quote{font-family:'Noto Serif KR',serif;line-height:1.75;color:var(--quote);white-space:pre-wrap;word-break:keep-all}

/* 기타 */
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:10;border:0;border-radius:999px;background:var(--accent);color:#fff;
  padding:14px 20px;font-weight:650;box-shadow:0 6px 18px rgba(40,60,50,.3);cursor:pointer}
html[data-mode="dark"] .fab{color:#10140F}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--faint);padding:80px 0}

/* ===== v2.3: 메모 · 할 일 ===== */
.quick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0 10px}
.quick textarea{width:100%;border:0;background:none;resize:none;outline:none;font-size:15.5px;line-height:1.55;min-height:28px;padding:2px 0}
.qbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.qtype{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--sub);cursor:pointer}
.qtype.todo-on{border-color:var(--accent);color:var(--accent);font-weight:650}
.qdue{flex:1;font-size:12.5px;color:var(--accent);font-weight:600}
.qbar .btn{padding:7px 16px}
.btn:disabled{opacity:.45;cursor:default}
.group-label span{color:var(--faint);font-weight:500;margin-left:4px}
.group-label.late{color:var(--warn)}
.todo-list{display:flex;flex-direction:column}
.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:none;cursor:pointer;color:#fff;font-size:13px;font-weight:800;line-height:1;margin-top:1px;transition:background .15s,border-color .15s}
.todo.fin .tick{background:var(--accent);border-color:var(--accent)}
html[data-mode="dark"] .todo.fin .tick{color:#10140F}
.tbody{flex:1;min-width:0;cursor:pointer}
.tt{font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.todo.fin .tt{color:var(--faint);text-decoration:line-through}
.tm{font-size:12.5px;color:var(--faint);margin-top:2px}
.tm .late{color:var(--warn);font-weight:650}.tm .due-now{color:var(--accent);font-weight:650}
.memo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
@media (max-width:360px){.memo-grid{grid-template-columns:1fr}}
.memo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
.memo .mx{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.memo .mm{font-size:11.5px;color:var(--faint);margin-top:8px}
.qmenu{display:flex;flex-direction:column;gap:6px}
.qmenu button{display:flex;align-items:baseline;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 15px;cursor:pointer}
.qmenu b{font-size:15px;font-weight:650;min-width:118px}
.qmenu span{font-size:12.5px;color:var(--sub)}
.fab{width:56px;height:56px;padding:0;font-size:26px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center}
.nav button{max-width:130px}
/* ===== v2.3: 그물망 ===== */
.g-search{position:relative;margin:4px 0 2px}
.g-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.g-sug:empty{display:none}
.g-sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.legend{display:block}
.g-clusters{display:flex;flex-wrap:wrap;gap:6px}
.g-cl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink);cursor:pointer}
.g-cl.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.g-cl.muted{color:var(--sub);cursor:default}
.g-cl i,.ic-head .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.g-kinds{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-top:8px;align-items:center}
.g-kinds span{display:inline-flex;align-items:center;gap:5px}
.lg-book{background:var(--sub)!important}
.ic-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ic-head h3{display:flex;align-items:center;gap:8px;margin:0}
.ic-head .btn{padding:6px 12px;font-size:13px}
.ic-lb{font-size:12.5px;font-weight:650;color:var(--sub);margin:12px 0 6px}
.info-card .sub{margin-top:4px}
/* ===== v2.3: 통계 · 책 목록 ===== */
.tile.tap{text-align:left;cursor:pointer;font:inherit;color:inherit}
.tile.tap:active{transform:scale(.98)}
.tile.tap span{color:var(--accent)}
.more-btn{display:block;width:100%;margin-top:8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:7px;font-size:12.5px;color:var(--sub);cursor:pointer}
.bl-head h1{font-size:22px;margin:4px 0 2px}
.bl-head p{margin:0;color:var(--sub);font-size:13.5px}
.bl-tools{display:flex;gap:8px;align-items:center;margin:14px 0 10px}
.bl-mode{flex:none}.bl-mode button{padding:6px 12px}
.bl-sort{flex:1;padding:8px 10px}
.bl-lines{display:flex;flex-direction:column}
.bl-row{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.bl-row .spine{width:36px;min-height:52px;font-size:10px}
.bl-info{flex:1;min-width:0}
.bl-t{font-weight:650;font-size:14.5px;line-height:1.35}
.bl-a{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-m{font-size:12px;color:var(--faint);margin-top:3px;display:flex;flex-wrap:wrap;gap:0 5px;align-items:center}
.bl-m i{font-style:normal;color:var(--line)}
.bl-album{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
@media (min-width:560px){.bl-album{grid-template-columns:repeat(4,1fr)}}
.bl-card{cursor:pointer;min-width:0}
.bl-card .spine{width:100%;min-height:0;aspect-ratio:2/3;border-radius:4px;font-size:13px;margin-bottom:6px}
.bl-card .bl-t{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bl-card .bl-m{margin-top:2px;font-size:11.5px}
.bl-card .stars{font-size:11.5px}
.mode-seg button{font-size:13px}

/* ===== v2.4 ===== */
.ftools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.ftool{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--sub);cursor:pointer;font-weight:550;margin:0}
.ftool.rec-on,.vbtn.rec-on{background:var(--warn);border-color:var(--warn);color:#fff}
.vbtns{display:inline-flex;gap:4px}
.vbtn{width:34px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:999px;cursor:pointer;font-size:15px;line-height:1;padding:0}
#rec .rec-sheet{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#rec .rec-sheet.busy{display:flex;gap:10px;align-items:center;font-size:14px}
.rec-top{display:flex;align-items:center;gap:10px}.rec-top b{font-size:20px;font-variant-numeric:tabular-nums;flex:1}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}.rec-bar i{display:block;height:100%;width:0;background:var(--warn);transition:width .15s}
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:48vh;overflow:auto}
.pick-list button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13.5px;line-height:1.55;display:flex;flex-direction:column;gap:2px}
/* 노트 목록 */
.n-group{width:auto;padding:5px 10px;font-size:13px;border-radius:999px}
.seed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0 6px}
.seed .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
.seed .lb button{border:0;background:none;color:var(--sub);font-size:12.5px;cursor:pointer}
.seed .tx{font-family:var(--serif,'Noto Serif KR'),serif;line-height:1.75;font-size:14.5px;color:var(--quote);white-space:pre-wrap;word-break:keep-all}
.seed .mt{font-size:12px;color:var(--faint);margin-top:6px}
.note-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.note-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.nc-top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.nst{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--sub)}
.nst.st-1{background:var(--accent-soft);color:var(--accent)}.nst.st-2{background:var(--accent);color:var(--card)}.nst.st-3{background:var(--ink);color:var(--paper)}
.nc-t{font-weight:700;font-size:16px;line-height:1.4}
.nc-x{font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nc-m{font-size:12px;color:var(--faint);margin-top:6px}
/* 노트 쓰기 */
.ne-top-r{display:flex;gap:6px;align-items:center}
.ne-state{width:auto;padding:5px 10px;font-size:13px}
.ne-mode{margin:4px 0 10px;max-width:220px}
.ne-title{width:100%;border:0;background:none;outline:none;font-family:var(--serif,'Noto Serif KR'),serif;font-size:24px;font-weight:700;padding:6px 0;color:var(--ink)}
.ne-tools{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:6px 0 8px;position:sticky;top:0;background:var(--paper);z-index:4;border-bottom:1px solid var(--line);margin-bottom:8px}
.ne-tools>button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.ne-body{width:100%;border:0;background:none;outline:none;resize:none;font-family:var(--serif,'Noto Serif KR'),serif;font-size:16.5px;line-height:1.95;color:var(--ink);min-height:260px;word-break:keep-all;padding:0}
.ne-count{font-size:12px;color:var(--faint);margin:6px 0 10px}
.ne-saved{text-align:right;color:var(--faint);margin-top:6px}
.ne-read{font-family:var(--serif,'Noto Serif KR'),serif;font-size:16.5px;line-height:1.95;word-break:keep-all;color:var(--ink)}
.ne-read h1{font-size:25px;line-height:1.35;margin:6px 0 18px}
.ne-read h2{font-size:18.5px;margin:26px 0 8px}
.ne-read p{margin:0 0 14px}
.ne-read blockquote{margin:14px 0;padding:4px 0 4px 16px;border-left:3px solid var(--accent);color:var(--quote);font-size:15.5px}
.ne-read ul{padding-left:20px;margin:0 0 14px}
.wlink{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.wlink.dead{color:var(--faint);text-decoration-style:dotted}
.nspine{background:var(--accent)!important;writing-mode:horizontal-tb!important;font-size:12px!important}
.rel-list{max-height:56vh;overflow:auto;margin-top:8px}
.fix{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.fix.done{opacity:.45}.fix s{color:var(--warn)}
.ver{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.ver .btn{flex:none;font-size:12.5px;padding:6px 10px}
/* 더보기 · 잠금 */
.more-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.more-list button{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;cursor:pointer;column-gap:8px}
.more-list .mi{grid-row:1/3;font-size:22px;align-self:center}
.more-list b{font-size:15.5px}.more-list span:not(.mi){font-size:12.5px;color:var(--sub)}
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center}
.lock-box{width:min(80vw,300px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lock-ic{font-size:36px}.lock-box b{font-size:18px;margin-bottom:6px}
.pin-in{text-align:center;font-size:22px;letter-spacing:.4em}
.pin-in::placeholder{letter-spacing:0;font-size:16px}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;padding:0 8mm}body{background:#fff!important;padding:0!important}}

/* ===== 업데이트 내역 · 공유 · 디자인 고르기 ===== */
.share-peek{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:keep-all}
.share-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:52vh;overflow:auto}
.share-list .spine{width:34px;min-height:48px;font-size:10px}
.notes{display:flex;flex-direction:column;gap:4px}
.note{border-top:1px solid var(--line);padding:12px 2px 6px}
.note:first-child{border-top:0;padding-top:2px}
.nh{display:flex;align-items:baseline;gap:8px}
.nh b{font-size:14px;color:var(--accent)}
.nh span{font-weight:600;font-size:14px;flex:1}
.nh em{font-style:normal;font-size:12px;color:var(--faint)}
.note ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--sub)}
.note.now ul{color:var(--ink)}
.note-link{display:flex;justify-content:space-between;width:100%;margin-top:12px;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:550}
.note-link span{color:var(--faint);font-weight:400}
.note-link+.note-link{margin-top:8px}
.chk{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--ink)}
.chk:first-child{border-top:0}
.chk b{width:20px;flex:none;text-align:center}
.chk.ok b{color:var(--accent)}.chk.no b{color:var(--warn)}
.chk em{font-style:normal;color:var(--sub);font-size:12.5px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 11px;cursor:pointer}
.theme-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-opt b{font-size:14px}
.theme-opt span{font-size:12px;color:var(--sub);line-height:1.45}
.tsw{display:flex;gap:3px;margin-bottom:4px}
.tsw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= 시안 1 · 원고지 =================
   서늘한 종이, 만년필 잉크색, 문장은 옅은 붉은 줄 위에. 내가 쓰던 <제목> 꺾쇠를 그대로 */
html[data-theme="manuscript"]{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#1D2330; --sub:#5A6270; --faint:#8F96A1;
  --line:#DADDD6; --accent:#2D4F86; --accent-soft:#E4EAF4; --warn:#B04A3A; --quote:#1D2B45;
  --rule:#EBCFC8; --shadow:none; --serif:'Gowun Batang','Noto Serif KR',serif;
}
html[data-mode="dark"][data-theme="manuscript"]{
  --paper:#15181E; --card:#1C2028; --ink:#E7E9ED; --sub:#A3AAB6; --faint:#6E7581;
  --line:#2E333D; --accent:#93B2E8; --accent-soft:#243149; --warn:#E59484; --quote:#DCE4F2; --rule:#4A3633; }
html[data-theme="manuscript"] h1,
html[data-theme="manuscript"] .dtitle,
html[data-theme="manuscript"] .stitle,
html[data-theme="manuscript"] .snip.quote .txt,
html[data-theme="manuscript"] .today .tx,
html[data-theme="manuscript"] .report .quote,
html[data-theme="manuscript"] .scan-chunk textarea.field{font-family:var(--serif)}
html[data-theme="manuscript"] h1{font-weight:700;font-size:25px}
html[data-theme="manuscript"] .book,
html[data-theme="manuscript"] .snip,
html[data-theme="manuscript"] .today,
html[data-theme="manuscript"] .panel,
html[data-theme="manuscript"] .panel2,
html[data-theme="manuscript"] .tile,
html[data-theme="manuscript"] .hit{border-radius:6px}
html[data-theme="manuscript"] .chip,
html[data-theme="manuscript"] .badge{border-radius:4px}
html[data-theme="manuscript"] .stitle{font-weight:700;color:var(--accent)}

<script>
/* ===== 상태 ===== */
const S = { books: [], snips: [], today: '', filter: '읽는중', q: '', view: 'library', bookId: null };
const FILTERS = ['읽는중', '읽을예정', '완독', '전체'];
const FILTER_LABEL = { '읽는중': '읽는 중', '읽을예정': '읽고 싶은' };

/* ===== 서버 연결 (앱 ↔ 구글 시트) ===== */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const API = { url: LS.get('api_url') || '', key: LS.get('api_key') || '' };
const LONG_FNS = { autoKeywords: 1, askAssistant: 1 };
const WRITE_FNS = { saveBook: 1, finishBook: 1, deleteBook: 1, saveSettings: 1, renameKeyword: 1, autoKeywords: 1 };

async function rpc(fn, ...args) {
  if (!API.url || !API.key) { const e = new Error('먼저 ⚙ 설정에서 서버를 연결해 주세요'); e.network = true; throw e; }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), LONG_FNS[fn] ? 360000 : 60000);
  let r;
  try {
    r = await fetch(API.url, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ k: API.key, fn, args })
    });
  } catch (e) {
    const err = new Error(navigator.onLine === false ? '인터넷에 연결되어 있지 않아요' : '서버에 연결하지 못했어요');
    err.network = true; throw err;
  } finally { clearTimeout(timer); }
  let j;
  try { j = await r.json(); } catch (e) {
    const err = new Error('서버 답을 읽지 못했어요. 배포의 액세스 권한이 "모든 사용자"인지 확인해 주세요');
    err.network = true; throw err;
  }
  if (!j.ok) throw new Error(j.error || '알 수 없는 오류');
  return j.data;
}
function call(fn, ...args) {
  return rpc(fn, ...args).then(r => { if (WRITE_FNS[fn]) setTimeout(saveCache, 30); return r; })
    .catch(e => { toast('⚠ ' + (e.message || e)); throw e; });
}
function callQuiet(fn, ...args) { return rpc(fn, ...args).catch(() => null); }

/* ----- 기기에 저장해 두는 데이터 (다음에 열 때 바로 보이도록) ----- */
const CACHE_KEY = 'lib_cache_v1', OUTBOX_KEY = 'lib_outbox_v1';
function localToday() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
// 기기 저장: 큰 데이터는 IndexedDB (용량 넉넉), 작은 설정·대기 목록은 localStorage
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('my-library', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    get: k => run('readonly', st => st.get(k)).catch(() => undefined),
    set: (k, v) => run('readwrite', st => st.put(v, k)).catch(() => false),
    del: k => run('readwrite', st => st.delete(k)).catch(() => false)
  };
})();
let cacheTimer = null;
function saveCache() {
  if (!S.loaded) return;
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    IDB.set(CACHE_KEY, { ver: S.ver || '', books: S.books, snippets: S.snips, memos: S.memos.concat(S.logs || []), notes: S.notes, settings: S.settings, at: Date.now() });
  }, 250);
}
async function loadCache() {
  let c = await IDB.get(CACHE_KEY);
  if (!c) {   // 예전 버전(localStorage)에 저장된 것 옮기기
    try { c = JSON.parse(LS.get(CACHE_KEY) || 'null'); } catch (e) { c = null; }
    if (c) { await IDB.set(CACHE_KEY, c); LS.del(CACHE_KEY); }
  }
  return c || null;
}

/* ----- 바로 저장 (먼저 화면에 반영 → 뒤에서 시트에 저장, 끊기면 다시 시도) ----- */
S.outbox = (() => { try { return JSON.parse(LS.get(OUTBOX_KEY) || '[]'); } catch (e) { return []; } })();
S.outbox.forEach(o => { o.sending = false; });
S.idMap = {};
S.syncState = '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isTemp = id => /^T/.test(String(id || ''));
S.memos = [];
// 바로 저장되는 종류: 저장 함수 → 목록 이름
const OPS = { saveSnippet: { list: 'snips', del: 'deleteSnippet' }, saveMemo: { list: 'memos', del: 'deleteMemo' }, saveNote: { list: 'notes', del: 'deleteNote' } };
const DEL_OPS = { deleteSnippet: 'snips', deleteMemo: 'memos', deleteNote: 'notes' };
const resolveId = id => (id && S.idMap[id]) || id;
function persistOutbox() { LS.set(OUTBOX_KEY, JSON.stringify(S.outbox.map(o => Object.assign({}, o, { sending: false })))); renderSync(); }
function normKw(k) { return uniq(String(k || '').split(/[,#\n]/).map(x => x.trim())).join(', '); }

function upsertLocal(list, x) { const arr = S[list]; const i = arr.findIndex(y => y.ID === x.ID); if (i >= 0) arr[i] = x; else arr.push(x); }
function upsertSnipLocal(x) { upsertLocal('snips', x); }
function queue(op) {
  op.cid = op.cid || uid();
  if (OPS[op.fn]) {
    const ex = S.outbox.find(o => o.fn === op.fn && o.data.ID === op.data.ID && !o.sending);
    if (ex) { ex.data = op.data; ex.local = op.local; ex.error = ''; if (op.args && op.args[0]) ex.args = op.args; persistOutbox(); saveCache(); flush(); return; }
  }
  if (DEL_OPS[op.fn] && isTemp(op.id) && !S.outbox.some(o => o.sending && o.data && o.data.ID === op.id)) {
    S.outbox = S.outbox.filter(o => !(o.data && o.data.ID === op.id));
    persistOutbox(); saveCache(); return;
  }
  if (op.fn === 'updateBookFields') {

      const op = S.outbox[0];
      if (op.error) break;   // 실패한 건 사용자가 다시 시도할 때까지 멈춤

          S[list].push(saved);
          if (temp) { remapId(op.data.ID, saved.ID); changedIds = true; }
        } else if (DEL_OPS[op.fn]) {
          await rpc(op.fn, op.id);

const SNIP_DRAFT_KEY = 'snip_draft_v1';

function snipDraftKey(s) { return s ? 'id:' + s.ID : 'new:' + S.bookId; }
function snipFormValues() {
  return { type: snipType, ttl: $('f-ttl') ? $('f-ttl').value : '', txt: $('f-txt') ? $('f-txt').value : '', memo: $('f-memo') ? $('f-memo').value : '', page: $('f-page') ? $('f-page').value : '', kw: $('f-kw') ? $('f-kw').value : '' };
}
function showMemoField() { $('memo-wrap').classList.remove('hidden'); $('memo-add').classList.add('hidden'); setTimeout(() => $('f-memo').focus(), 30);
}
function readSnipDraft() { try { return JSON.parse(LS.get(SNIP_DRAFT_KEY) || 'null'); } catch (e) { return null; } }
function clearSnipDraft() { LS.del(SNIP_DRAFT_KEY); S.snipDraftOn = false; clearTimeout(S.snipDraftT); }
function saveSnipDraft() {
  if (!S.snipDraftOn || !$('f-txt')) return;
  const v = snipFormValues(), base = S.snipDraft0 || {};
  const same = ['type', 'ttl', 'txt', 'memo', 'page', 'kw'].every(k => String(v[k] || '') === String(base[k] || ''));
  if (same || (!v.txt.trim() && !v.ttl.trim())) { LS.del(SNIP_DRAFT_KEY); return; }
  LS.set(SNIP_DRAFT_KEY, JSON.stringify(Object.assign({ key: S.snipDraftKey, at: Date.now() }, v)));
  const st = $('draft-state'); if (st) st.textContent = '임시저장 ' + hhmm();
}
function snipDraftSoon() { clearTimeout(S.snipDraftT); S.snipDraftT = setTimeout(saveSnipDraft, 500); }
function bindSnipDraft(s) {
  S.snipDraftKey = snipDraftKey(s); S.snipDraftOn = true;
  S.snipDraft0 = snipFormValues();

  if (d && d.key === S.snipDraftKey && (d.txt || d.ttl)) {
    const fill = v => { $('f-ttl').value = v.ttl || ''; $('f-txt').value = v.txt || ''; $('f-page').value = v.page || ''; $('f-kw').value = v.kw || '';
      $('f-memo').value = v.memo || ''; $('memo-wrap').classList.toggle('hidden', !v.memo); $('memo-add').classList.toggle('hidden', !!v.memo);
      snipType = v.type || snipType; [...$('seg').children].forEach(x => x.classList.toggle('on', x.dataset.t === snipType)); };
    const orig = S.snipDraft0;
    fill(d);
    const when = new Date(d.at); const label = (when.toDateString() === new Date().toDateString() ? '' : (when.getMonth() + 1) + '/' + when.getDate() + ' ') + String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
    $('draft-note').innerHTML = `<div class="draft-note"><span>✎ ${label}에 쓰던 내용을 불러왔어요</span><button type="button" id="draft-drop">${s ? '원래대로' : '지우기'}</button></div>`;
    $('draft-drop').onclick = () => { fill(orig); LS.del(SNIP_DRAFT_KEY); $('draft-note').innerHTML = ''; toast(s ? '저장된 내용으로 되돌렸어요' : '임시저장을 지웠어요'); };
  }

function normAuthor(a) { return String(a || '').replace(/\(.*?\)/g, '').replace(/\s+/g, '').toLowerCase(); }
function guessCategory(info) {
  const others = S.books.filter(b => b['대분류'] && b.ID !== info.ID);
  // 1) 같은 저자의 책이 있으면 그 분류
  const au = splitAuthors(info['저자']).map(normAuthor).filter(Boolean);
  for (const a of au) {
    const same = others.filter(b => splitAuthors(b['저자']).map(normAuthor).includes(a));
    if (same.length) { const pick = same[same.length - 1]; return { '대분류': pick['대분류'], '중분류': pick['중분류'] || '', '개인분류': pick['개인분류'] || '', how: '같은 저자 책 기준' }; }
  }
  // 2) 같은 시리즈 (제목 앞부분이 같은 책)
  const t = String(info['제목'] || '').replace(/\(.*?\)/g, '').trim();
  const stem = t.replace(/\s*\d+\s*(권|부|편)?$/, '').trim();
  if (stem.length >= 3) { const ser = others.find(b => String(b['제목']).replace(/\(.*?\)/g, '').trim().startsWith(stem)); if (ser) return { '대분류': ser['대분류'], '중분류': ser['중분류'] || '', '개인분류': ser['개인분류'] || '', how: '같은 시리즈 기준' }; }
  // 3) 제목 낱말
  for (const [re, big, mid, mine] of CAT_RULES) {
    if (re.test(t) && big) return { '대분류': big, '중분류': mid, '개인분류': mine, how: '제목 낱말 기준' };
  }
  return null;
}
async function aiCategory(info) {

  const q = `[분류 요청] 아래 책 한 권의 분류만 골라 줘. 내 기록이나 필사는 참고하지 말고, 이 책 자체가 어떤 책인지로 판단해.
책: 제목 "${info['제목']}" / 저자 ${info['저자'] || '모름'}${info['옮긴이'] ? ' / 옮긴이 ' + info['옮긴이'] : ''}${info['출판사'] ? ' / 출판사 ' + info['출판사'] : ''}

다른 말 없이 JSON 한 줄로만 답해: {"대분류":"…","중분류":"…","개인분류":"…"}`;

}

// 검증한 8색 (밝은 화면 / 어두운 화면). 주제 묶음 크기 순서대로 고정, 9번째부터는 회색
const CLUSTER_COLORS = { light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'],
  dark: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'] };

function keywordStats() {

  S.snips.forEach(s => splitKw(s['키워드']).forEach(k => {
    m[k] = m[k] || { kw: k, n: 0, books: new Set() };
    m[k].n++; m[k].books.add(s['책ID']);
  }));
  return Object.values(m).sort((a, b) => b.n - a.n || b.books.size - a.books.size);
}

/* 키워드끼리 얼마나 함께 나오나 + 주제 묶음 (데이터가 바뀔 때만 다시 계산) */
let TOPIC = null, TOPIC_KEY = '';
function topicData() {
  const key = S.snips.length + ':' + S.snips.reduce((t, s) => t + String(s['키워드'] || '').length, 0);
  if (TOPIC && TOPIC_KEY === key) return TOPIC;
  const cnt = {}, co = {}, kwBooks = {}, bookKw = {};
  S.snips.forEach(s => {
    const ks = uniq(splitKw(s['키워드'])); const bid = s['책ID'];
    ks.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; (kwBooks[k] = kwBooks[k] || {})[bid] = (kwBooks[k][bid] || 0) + 1; (bookKw[bid] = bookKw[bid] || {})[k] = (bookKw[bid][k] || 0) + 1; });
    for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
      const [a, b] = [ks[i], ks[j]].sort(); const kk = a + '\u0001' + b; co[kk] = (co[kk] || 0) + 1;
    }
  });
  // 연관 강도: 함께 나온 횟수를 두 키워드 크기로 나눠서, '사랑'처럼 어디에나 있는 말이 모두를 삼키지 않게
  const nb = {}; Object.keys(cnt).forEach(k => nb[k] = {});
  const addW = (a, b, w) => { nb[a][b] = (nb[a][b] || 0) + w; nb[b][a] = (nb[b][a] || 0) + w; };
  Object.entries(co).forEach(([kk, w]) => { const [a, b] = kk.split('\u0001'); addW(a, b, w / Math.sqrt(cnt[a] * cnt[b])); });
  Object.values(bookKw).forEach(m => { const ks = Object.keys(m); if (ks.length > 40) return;
    for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) addW(ks[i], ks[j], 0.15 / Math.sqrt(cnt[ks[i]] * cnt[ks[j]])); });
  // 주제 묶기 (모듈성 최대화 한 단계)
  const ks = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b));
  const deg = {}; ks.forEach(k => deg[k] = Object.values(nb[k]).reduce((a, b) => a + b, 0));
  const m2 = ks.reduce((t, k) => t + deg[k], 0) || 1;
  const com = {}, tot = {}; ks.forEach(k => { com[k] = k; tot[k] = deg[k]; });
  for (let it = 0, moved = true; moved && it < 30; it++) {
    moved = false;
    ks.forEach(k => {
      const cur = com[k], links = {};
      Object.entries(nb[k]).forEach(([o, w]) => links[com[o]] = (links[com[o]] || 0) + w);
      tot[cur] -= deg[k];
      let best = cur, gain = (links[cur] || 0) - tot[cur] * deg[k] / m2;
      Object.entries(links).forEach(([c, w]) => { const g = w - tot[c] * deg[k] / m2; if (g > gain + 1e-9) { gain = g; best = c; } });
      tot[best] += deg[k]; if (best !== cur) { com[k] = best; moved = true; }
    });
  }
  const groups = {}; ks.forEach(k => { if (deg[k] > 0) (groups[com[k]] = groups[com[k]] || []).push(k); });
  let cl = Object.values(groups).map(g => ({ kws: g, size: g.reduce((t, k) => t + cnt[k], 0) }));
  // 색은 8개뿐이라, 작은 묶음은 가장 많이 이어진 묶음에 합쳐서 8개 이하로
  while (cl.length > 8) {
    cl.sort((a, b) => a.size - b.size);
    const small = cl.shift(), inSmall = new Set(small.kws);
    let best = null, bw = -1;
    cl.forEach(c => { let w = 0; c.kws.forEach(k => small.kws.forEach(o => { w += (nb[k][o] || 0); })); if (w > bw) { bw = w; best = c; } });
    best.kws = best.kws.concat(small.kws); best.size += small.size;
  }
  const loners = ks.filter(k => !(deg[k] > 0));   // 다른 키워드와 한 번도 같이 안 나온 것 → 회색
  const clusters = cl.map(c => ({ kws: c.kws.sort((a, b) => cnt[b] - cnt[a]), size: c.size }))
    .sort((a, b) => b.size - a.size || a.kws[0].localeCompare(b.kws[0]));
  if (loners.length) clusters.push({ kws: loners, size: 0, loners: true });
  const clusterOf = {}; clusters.forEach((c, i) => { c.i = c.loners ? 99 : i; c.kws.forEach(k => clusterOf[k] = c.i); });
  TOPIC = { cnt, co, nb, kwBooks, bookKw, clusters, clusterOf, ranked: ks }; TOPIC_KEY = key;
  return TOPIC;
}
function coCount(a, b) { const T = topicData(); const [x, y] = [a, b].sort(); return T.co[x + '\u0001' + y] || 0; }
function clusterColor(i) {
  const pal = CLUSTER_COLORS[document.documentElement.dataset.mode === 'dark' ? 'dark' : 'light'];
  return i != null && i < 8 ? pal[i] : cssVar('--faint');
}

  const T = topicData();
  return Object.keys(T.nb[k] || {}).map(o => ({ k: o, c: coCount(k, o), w: T.nb[k][o] }))
    .filter(x => x.c > 0).sort((a, b) => b.c - a.c || b.w - a.w).slice(0, n);
}

function buildGraph() {
  const T = topicData();
  const nodes = {}, edges = [];
  const add = (id, type, label, ref, w) => nodes[id] || (nodes[id] = { id, type, label, ref, w: w || 0 });
  const link = (a, b, w) => { if (!nodes[a] || !nodes[b] || a === b) return; edges.push({ a, b, w: w || 1 }); };
  const kwSet = (n) => (n ? T.ranked.slice(0, n) : T.ranked.filter(k => T.cnt[k] >= 1));
  let mode = G.mode;

  if (G.focus) {
    mode = 'focus';
    const fid = G.focus;
    if (fid.startsWith('k:')) {
      const k = fid.slice(2);
      add(fid, 'kw', '#' + k, k, T.cnt[k] || 1);
      const rel = relatedKw(k, 12);
      rel.forEach(r => { add('k:' + r.k, 'kw', '#' + r.k, r.k, T.cnt[r.k]); link(fid, 'k:' + r.k, r.c); });
      const bs = Object.entries(T.kwBooks[k] || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
      bs.forEach(([bid, n]) => { const b = book(bid); if (!b) return; add('b:' + bid, 'book', b['제목'], bid, n); link(fid, 'b:' + bid, n); });
      rel.forEach(r => bs.forEach(([bid]) => { const n = (T.bookKw[bid] || {})[r.k]; if (n) link('k:' + r.k, 'b:' + bid, n); }));
      for (let i = 0; i < rel.length; i++) for (let j = i + 1; j < rel.length; j++) { const c = coCount(rel[i].k, rel[j].k); if (c >= 2) link('k:' + rel[i].k, 'k:' + rel[j].k, c); }
    } else if (fid.startsWith('b:')) {
      const bid = fid.slice(2), b = book(bid);
      if (b) {
        add(fid, 'book', b['제목'], bid, 10);
        const mine = Object.entries(T.bookKw[bid] || {}).sort((a, c) => c[1] - a[1]).slice(0, 15);
        mine.forEach(([k, n]) => { add('k:' + k, 'kw', '#' + k, k, T.cnt[k]); link(fid, 'k:' + k, n); });
        const share = {};
        mine.forEach(([k]) => Object.keys(T.kwBooks[k] || {}).forEach(o => { if (o !== bid) share[o] = (share[o] || 0) + 1; }));
        Object.entries(share).filter(([, n]) => n >= 2).sort((a, c) => c[1] - a[1]).slice(0, 8).forEach(([o]) => {
          const ob = book(o); if (!ob) return; add('b:' + o, 'book', ob['제목'], o, 3);
          mine.forEach(([k]) => { const n = (T.bookKw[o] || {})[k]; if (n) link('b:' + o, 'k:' + k, n); });
        });
      }
    }
  } else if (mode === 'topic') {
    const ks = kwSet(G.top);
    const inSet = new Set(ks);
    ks.forEach(k => add('k:' + k, 'kw', '#' + k, k, T.cnt[k]));
    // 키워드마다 가장 강하게 이어진 4개만 → 실타래가 되지 않게
    const seen = new Set();
    ks.forEach(k => {
      Object.entries(T.nb[k] || {}).filter(([o]) => inSet.has(o) && coCount(k, o) > 0)
        .sort((a, b) => b[1] - a[1]).slice(0, 4)
        .forEach(([o]) => { const kk = [k, o].sort().join('\u0001'); if (seen.has(kk)) return; seen.add(kk); link('k:' + k, 'k:' + o, coCount(k, o)); });
    });
  } else {
    const ks = new Set(kwSet(G.top));
    Object.entries(T.bookKw).forEach(([bid, m]) => {
      const b = book(bid); if (!b) return;
      Object.entries(m).forEach(([k, n]) => { if (!ks.has(k)) return; add('b:' + bid, 'book', b['제목'], bid); add('k:' + k, 'kw', '#' + k, k, T.cnt[k]); link('b:' + bid, 'k:' + k, n); });
    });
    if (G.opt.au) {
      const m = {};
      S.books.forEach(b => splitAuthors(b['저자']).forEach(a => (m[a] = m[a] || []).push(b)));
      Object.entries(m).filter(([, bs]) => bs.length >= 2).forEach(([a, bs]) => bs.forEach(b => {
        add('b:' + b.ID, 'book', b['제목'], b.ID); add('a:' + a, 'au', a, a, bs.length); link('b:' + b.ID, 'a:' + a, 1);
      }));
    }
    if (G.opt.cat) {
      const m = {};
      S.books.forEach(b => { const c = String(b['개인분류'] || '').trim(); if (c) (m[c] = m[c] || []).push(b); });
      Object.entries(m).filter(([, bs]) => bs.length >= 2).forEach(([c, bs]) => bs.forEach(b => {
        add('b:' + b.ID, 'book', b['제목'], b.ID); add('c:' + c, 'cat', c, c, bs.length); link('b:' + b.ID, 'c:' + c, 1);
      }));
    }
  }
  G.cfg = CFG[mode] || CFG.book;
  G.view = mode;

  const old = G.byId || {};
  const list = Object.values(nodes);
  const R = Math.sqrt(list.length) * (mode === 'book' ? 40 : 60);
  list.forEach(n => {
    const o = old[n.id];
    if (o && mode !== 'focus') { n.x = o.x; n.y = o.y; }
    else { const r = seeded(n.id); const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R; n.x = Math.cos(a) * d; n.y = Math.sin(a) * d; }
    if (n.type === 'kw') { n.cl = T.clusterOf[n.ref]; n.r = 5 + Math.min(17, Math.sqrt(T.cnt[n.ref] || 1) * 1.9); }
    else if (n.type === 'book') n.r = mode === 'focus' ? 9 : 7;
    else n.r = 6 + Math.min(8, Math.sqrt(n.w) * 2);
    if (G.focus === n.id) { n.x = 0; n.y = 0; n.pin = true; n.r += 4; }
  });
  G.nodes = list; G.edges = edges.map(e => ({ a: nodes[e.a], b: nodes[e.b], w: e.w }));
  G.byId = nodes; G.nb = {};
  G.edges.forEach(e => { (G.nb[e.a.id] = G.nb[e.a.id] || new Set()).add(e.b.id); (G.nb[e.b.id] = G.nb[e.b.id] || new Set()).add(e.a.id); });
  if (G.sel && !nodes[G.sel.id]) G.sel = null; else if (G.sel) G.sel = nodes[G.sel.id];
  simulate(list.some(n => !old[n.id]) || mode === 'focus' ? 360 : 60);
}

function simulate(iters) {
  const N = G.nodes, E = G.edges, n = N.length;
  if (!n) return;
  for (let it = 0; it < iters; it++) {
    const alpha = 1 - it / iters;
    const C = G.cfg;
    N.forEach(p => { p.fx = -p.x * C.grav; p.fy = -p.y * C.grav; });
    for (let i = 0; i < n; i++) {
      const a = N[i];
      for (let j = i + 1; j < n; j++) {
        const b = N[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 > C.cut * C.cut) continue;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const f = C.rep / d2;
        a.fx += dx * f; a.fy += dy * f; b.fx -= dx * f; b.fy -= dy * f;
      }
    }
    E.forEach(e => {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const L = C.len + e.a.r + e.b.r, k = C.k * Math.min(3, 1 + Math.log(e.w));
      const f = (d - L) * k / d;
      e.a.fx += dx * f; e.a.fy += dy * f; e.b.fx -= dx * f; e.b.fy -= dy * f;
    });
    N.forEach(p => {
      if (p === G.drag || p.pin) return;
      const m = Math.max(1.5, 22 * alpha);
      p.x += Math.max(-m, Math.min(m, p.fx)); p.y += Math.max(-m, Math.min(m, p.fy));
    });
  }
}

function setupCanvas() {
  const cv = $('g-canvas');
  const fit = () => { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; drawGraph(); };
  G.resize = fit;
  fit();
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const world = p => ({ x: (p.x - G.ox) / G.scale, y: (p.y - G.oy) / G.scale });
  const hit = p => {
    const w = world(p); let best = null, bd = Infinity;
    G.nodes.forEach(n => { const d = Math.hypot(n.x - w.x, n.y - w.y) * G.scale; if (d < nodeR(n) + 9 && d < bd) { bd = d; best = n; } });
    return best;
  };
  cv.onpointerdown = e => {
    cv.setPointerCapture(e.pointerId);
    G.ptr.set(e.pointerId, pos(e)); G.moved = 0;
    if (G.ptr.size === 1) { G.drag = hit(pos(e)); G.last = pos(e); cv.classList.add('dragging'); }
    else { G.drag = null; G.pinch = pinchState(); }
  };
  cv.onpointermove = e => {
    if (!G.ptr.has(e.pointerId)) return;
    const p = pos(e); G.ptr.set(e.pointerId, p);
    if (G.ptr.size >= 2 && G.pinch) {
      const s = pinchState(), k = s.d / G.pinch.d;
      zoomAt(s.c, k); G.ox += s.c.x - G.pinch.c.x; G.oy += s.c.y - G.pinch.c.y; G.pinch = s; G.moved = 99; drawGraph(); return;
    }
    const dx = p.x - G.last.x, dy = p.y - G.last.y; G.moved += Math.abs(dx) + Math.abs(dy); G.last = p;
    if (G.drag && G.moved > 3) { G.drag.x += dx / G.scale; G.drag.y += dy / G.scale; simulate(2); }
    else if (!G.drag) { G.ox += dx; G.oy += dy; }
    drawGraph();
  };
  cv.onpointerup = cv.onpointercancel = e => {
    const wasTap = G.ptr.size === 1 && G.moved < 6;
    G.ptr.delete(e.pointerId); cv.classList.remove('dragging');
    if (wasTap) gSelect(hit(pos(e)), false);
    if (G.ptr.size < 2) G.pinch = null;
    if (!G.ptr.size) G.drag = null;
  };
  cv.onwheel = e => { e.preventDefault(); zoomAt(pos(e), e.deltaY < 0 ? 1.12 : 0.89); drawGraph(); };
  function pinchState() {
    const [a, b] = [...G.ptr.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, c: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
  }
}
function zoomAt(p, k) {
  const s = Math.max(0.2, Math.min(4, G.scale * k)); k = s / G.scale;
  G.ox = p.x - (p.x - G.ox) * k; G.oy = p.y - (p.y - G.oy) * k; G.scale = s;
}
function gZoom(k) { const cv = $('g-canvas'), r = cv.getBoundingClientRect(); zoomAt({ x: r.width / 2, y: r.height / 2 }, k); drawGraph(); }
function gFit() {
  const cv = $('g-canvas'); if (!cv) return;
  const r = cv.getBoundingClientRect();
  if (!G.nodes.length) { G.scale = 1; G.ox = r.width / 2; G.oy = r.height / 2; drawGraph(); return; }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  G.nodes.forEach(n => { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); });
  const pad = 46, w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
  G.scale = Math.max(0.2, Math.min(2, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h)));
  G.ox = r.width / 2 - (x0 + w / 2) * G.scale; G.oy = r.height / 2 - (y0 + h / 2) * G.scale;
  drawGraph();
}

function nodeR(n) { return n.r * Math.max(0.75, Math.min(1.35, Math.sqrt(G.scale / 0.6))); }   // 화면 기준 크기
function roundRect(ctx, x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function chatHtml(m) {
  if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
  if (m.pending) return `<div class="msg bot"><span class="thinking">내 기록을 찾아보는 중</span></div>`;
  if (m.error) return `<div class="msg bot err">${esc(m.error)}</div>`;
  const order = (m.cites || []).map(c => c.id);
  const body = mdLite(m.text).replace(/\[([SNM]\d{6})\]/g, (all, id) => {
    const i = order.indexOf(id);
    return i < 0 ? '' : `<span class="cite" onclick="openCite('${id}')">${i + 1}</span>`;
  });
  return `<div class="msg bot">${body}
    ${order.length ? `<div class="sources">${m.cites.map((c, i) => `<button onclick="openCite('${c.id}')"><b>${i + 1}</b>${esc(c.book)}${c.page !== '' && c.page != null ? ' · p.' + esc(c.page) : ''}${c.title ? ' · ' + esc(c.title) : ''}</button>`).join('')}</div>` : ''}</div>`;
}
function mdLite(t) {
  const lines = esc(String(t || '')).split('\n');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  lines.forEach(l => {
    const ul = l.match(/^\s*[-*•]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (list !== tag) { close(); html += `<${tag}>`; list = tag; }
      html += `<li>${(ul || ol)[1]}</li>`;
    } else if (!l.trim()) close();
    else { close(); html += `<p>${l.replace(/^#+\s*/, '')}</p>`; }
  });
  close();
  return html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function scrollChat() { if (S.view === 'ai' && S.chat.length) setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); }
function openCite(id) {
  if (id[0] === 'N') { if (noteOf(id)) openNote(id); else toast('그 글을 찾지 못했어요'); return; }
  if (id[0] === 'M') { if (S.memos.some(m => m.ID === id)) { go('memo'); setTimeout(() => openMemo(id), 60); } return; }
  if (S.snips.some(x => x.ID === id)) openSnipInBook(id);
}

async function askAI(q) {
  q = String(q || $('ai-q').value).trim();
  if (!q || S.chat.some(m => m.pending)) return;
  $('ai-q').value = ''; autoGrow($('ai-q'));
  const history = S.chat.filter(m => !m.pending && !m.error).map(m => ({ role: m.role, text: m.text }));
  S.chat.push({ role: 'user', text: q });
  const bot = { role: 'assistant', pending: true };
  S.chat.push(bot);
  renderAIView();
  try {
    const r = await rpc('askAssistant', q, history);
    Object.assign(bot, { pending: false, text: r.answer, cites: r.cites });
  } catch (e) {
    Object.assign(bot, { pending: false, error: '답을 받지 못했어요: ' + (e.message || e) });
  }
  if (S.view === 'ai') renderAIView();
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(140, el.scrollHeight) + 'px'; }

async function runAutoKeywords() {
  const b = $('kw-all'); if (b) { b.disabled = true; b.textContent = '키워드 다는 중… (몇 분 걸려요)'; }
  try {
    const r = await call('autoKeywords');
    await refresh(true);
    toast(r.message);
    if (S.view === 'ai') renderAIView();
  } catch (e) { if (b) { b.disabled = false; b.textContent = 'AI로 키워드 달기'; } }
}

// 문장 입력 창: AI 키워드 추천
async function aiKeywords(btn) {
  const text = $('f-txt').value.trim();
  if (!text) { toast('내용을 먼저 입력해 주세요'); return; }
  btn.disabled = true; btn.textContent = '추천 중…';
  try {
    const ks = await call('suggestKeywords', { '책ID': S.bookId, '제목': $('f-ttl').value, '내용': text });
    const cur = $('f-kw').value.split(',').map(x => x.trim()).filter(Boolean);
    ks.forEach(k => { if (!cur.includes(k)) cur.push(k); });
    $('f-kw').value = cur.join(', ');
    if (!ks.length) toast('추천할 키워드를 찾지 못했어요');
  } finally { btn.disabled = false; btn.textContent = 'AI 추천'; }
}

/* ---------- 독서 기록: 여기까지 읽었어요 · 히스토리 · 매일 읽은 양 ---------- */
// 한 줄 = 그날 그 책을 어디까지 읽었나. 메모 시트에 종류 '독서기록', 내용 "2026-10-21 · p.120 (p.80부터)"
const LOG_RE = /^(\d{4}-\d{2}-\d{2})\s*·\s*p\.(\d+)(?:\s*\(p\.(\d+)부터\))?/;
function parseLog(m) { const r = LOG_RE.exec(String(m['내용'] || '')); return r ? { m, id: m.ID, bid: m['책ID'], date: r[1], page: Number(r[2]), base: r[3] != null ? Number(r[3]) : null } : null; }

// 사진을 적당한 크기의 JPEG로 줄이기 (글자는 또렷하게, 전송은 가볍게)
async function shrinkImage(file, max = 2400) {
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('사진을 열지 못했어요')); i.src = URL.createObjectURL(file); });
  }
  const w = img.width, h = img.height;
  const draw = (m, q) => {
    const s = Math.min(1, m / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  const big = draw(max, 0.85);
  return { data: big.slice(big.indexOf(',') + 1), thumb: draw(360, 0.7) };
}

async function scanFiles(files, append) {
  files = [...(files || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if (!files.length) return;
  const bookId = S.bookId;
  const fresh = files.map(f => ({ name: f.name, status: 'wait', thumb: '', mode: 'page', hl: [], full: null, error: '' }));
  if (append && S.scan && S.scan.bookId === bookId) S.scan.pages.push(...fresh);
  else S.scan = { bookId, pages: fresh };
  const mine = S.scan;
  renderScan();
  for (let i = 0; i < files.length; i++) {
    const pg = fresh[i]; if (S.scan !== mine) return;
    pg.status = 'reading'; renderScan();
    try {
      const img = await shrinkImage(files[i]);
      pg.thumb = img.thumb; renderScan();
      const r = await rpc('scanPage', { image: img.data, mime: 'image/jpeg', bookId });
      if (S.scan !== mine) return;   // 도중에 닫음
      const mk = it => ({ on: true, title: it.title || '', text: it.text || '', page: it.page || '', kw: (it.keywords || []).join(', ') });
      pg.hl = (r.highlights || []).map(mk);
      pg.full = r.page && r.page.text ? mk(r.page) : null;
      pg.kind = r.kind || '';
      pg.mode = pg.hl.length ? 'hl' : 'page';
      pg.status = 'done';
    } catch (e) {
      pg.status = 'error'; pg.error = e.message || String(e);
    }
    renderScan();
  }
}

function scanChunks(pg) { return pg.mode === 'hl' ? pg.hl : (pg.full ? [pg.full] : []); }

function renderScan() {
  if (!S.scan) return;
  const pages = S.scan.pages;
  const busy = pages.some(p => p.status === 'wait' || p.status === 'reading');
  const count = pages.reduce((n, p) => n + (p.status === 'done' ? scanChunks(p).filter(c => c.on && c.text.trim()).length : 0), 0);
  const sh = document.querySelector('#modal .sheet'); const top = sh ? sh.scrollTop : 0;
  const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f
    ? { id: document.activeElement.id, pos: document.activeElement.selectionStart } : null;
  const body = pages.map((p, pi) => {
    const head = `<div class="scan-head">${p.thumb ? `<img src="${p.thumb}" alt="">` : '<div class="scan-ph"></div>'}
      <div><b>${pages.length > 1 ? (pi + 1) + '번째 사진' : '사진'}</b>${p.kind ? ` <span class="small">${esc(p.kind)}</span>` : ''}<br>
      <span class="small">${p.status === 'wait' ? '기다리는 중' : p.status === 'reading' ? '<span class="spin"></span> 글자 읽는 중… (10~30초)' :
        p.status === 'error' ? '⚠ ' + esc(p.error) : p.hl.length ? `하이라이트 ${p.hl.length}곳을 찾았어요` : '하이라이트가 없어 본문 전체를 옮겼어요'}</span></div></div>`;
    if (p.status !== 'done') return `<div class="scan-page">${head}</div>`;
    const seg = p.hl.length && p.full ? `<div class="seg scan-seg">
      <button class="${p.mode === 'hl' ? 'on' : ''}" onclick="scanMode(${pi},'hl')">하이라이트만 (${p.hl.length})</button>
      <button class="${p.mode === 'page' ? 'on' : ''}" onclick="scanMode(${pi},'page')">페이지 전체</button></div>` : '';
    const list = scanChunks(p).map((c, ci) => `<div class="scan-chunk ${c.on ? '' : 'off'}">
      <label class="scan-on"><input type="checkbox" ${c.on ? 'checked' : ''} onchange="scanSet(${pi},${ci},'on',this.checked)"> 저장</label>
      <input class="field scan-title" id="sc-${pi}-${ci}-t" data-f="1" value="${esc(c.title)}" placeholder="제목" oninput="scanSet(${pi},${ci},'title',this.value)">
      <textarea class="field" id="sc-${pi}-${ci}-x" data-f="1" rows="5" oninput="scanSet(${pi},${ci},'text',this.value)">${esc(c.text)}</textarea>
      <div class="scan-row"><input class="field" id="sc-${pi}-${ci}-p" data-f="1" inputmode="decimal" placeholder="쪽수 (없으면 비움)" value="${esc(c.page)}" oninput="scanSet(${pi},${ci},'page',this.value)">
        <input class="field" id="sc-${pi}-${ci}-k" data-f="1" placeholder="키워드" value="${esc(c.kw)}" oninput="scanSet(${pi},${ci},'kw',this.value)"></div>
    </div>`).join('');
    return `<div class="scan-page">${head}${seg}${list}</div>`;
  }).join('');
  modal(`<h3>사진으로 필사 <span style="font-weight:400;color:var(--faint);font-size:13px">${esc((book(S.scan.bookId) || {})['제목'] || '')}</span></h3>
    <div class="small" style="margin-bottom:8px">AI가 읽은 내용이에요. 틀린 글자가 있으면 고친 뒤 저장하세요.</div>
    ${body}
    <div class="actions"><button class="btn" onclick="closeScan()">${busy ? '그만두기' : '취소'}</button>
      ${busy ? '' : `<label class="btn">+ 사진 더<input type="file" accept="image/*" multiple onchange="scanMore(this.files)" hidden></label>`}
      <button class="btn primary grow" ${count && !busy ? '' : 'disabled'} onclick="saveScan()">${busy ? '읽는 중…' : `${count}개 저장`}</button></div>`);
  const bd = document.querySelector('#modal .backdrop'); if (bd) bd.onclick = null;
  const sh2 = document.querySelector('#modal .sheet'); if (sh2) sh2.scrollTop = top;   // 바깥을 눌러도 닫히지 않게
  if (keep && $(keep.id)) { const el = $(keep.id); el.focus(); try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} }
}
function scanSet(pi, ci, k, v) {
  const c = scanChunks(S.scan.pages[pi])[ci]; c[k] = v;
  if (k === 'on') renderScan();
  else { const b = document.querySelector('.sheet .btn.primary'); const n = S.scan.pages.reduce((n, p) => n + (p.status === 'done' ? scanChunks(p).filter(c => c.on && c.text.trim()).length : 0), 0); if (b && !b.textContent.includes('읽는')) { b.textContent = n + '개 저장'; b.disabled = !n; } }
}
function scanMode(pi, m) { S.scan.pages[pi].mode = m; renderScan(); }
function closeScan() {
  const n = S.scan ? S.scan.pages.filter(p => p.status === 'done').length : 0;
  if (n && !confirm('읽어 온 내용을 저장하지 않고 닫을까요?')) return;
  S.scan = null; closeModal();
}
function scanMore(files) { scanFiles(files, true); }
function saveScan() {
  const sc = S.scan; if (!sc) return;
  const b = book(sc.bookId); let n = 0;
  sc.pages.forEach(p => {
    if (p.status !== 'done') return;
    scanChunks(p).forEach(c => {
      if (!c.on || !c.text.trim()) return;
      const data = { ID: 'T' + uid(), '책ID': sc.bookId, '유형': '인용', '내용': c.text.trim(), '쪽수': String(c.page || '').trim().replace(/\s*p$/i, ''),
        '제목': c.title.trim(), '키워드': normKw(c.kw), '출처': 'OCR' };
      const local = Object.assign({ '작성일': S.today }, data, { '책제목': b ? b['제목'] : '' });
      upsertSnipLocal(local); queue({ fn: 'saveSnippet', data, local }); n++;
    });
  });
  S.scan = null; closeModal();
  if (S.view === 'book' && S.bookId === sc.bookId) renderBook();
  toast(`${n}개를 필사했어요`);
}


/* ===================================================================
