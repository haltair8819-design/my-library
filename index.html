<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>(function(){var d=document.documentElement,t='manuscript',m='light';try{t=localStorage.getItem('theme')||t;m=localStorage.getItem('mode')||m}catch(e){}
d.dataset.theme=t;d.dataset.mode=m==='dark'?'dark':'light';
try{var c=localStorage.getItem('accent');if(c){var k=m==='dark';d.style.setProperty('--accent',k?'color-mix(in srgb, '+c+' 62%, white)':c);d.style.setProperty('--accent-soft',k?'color-mix(in srgb, '+c+' 30%, #15161a)':'color-mix(in srgb, '+c+' 13%, white)')}}catch(e){}})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 서재</title>
<meta name="theme-color" content="#F2F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.13">
</head>
<body>

<div class="wrap">
  <!-- 서재 -->
  <section id="v-library">
    <header>
      <div class="brand"><h1>나의 서재</h1><div class="brand-r"><span id="sync" class="sync hidden" onclick="openSync()"></span><button class="iconbtn" onclick="openSettings()">⚙ 설정</button></div></div>
      <div class="stats" id="stats"></div>
      <div id="goal"></div>
    </header>
    <div id="top"></div>
    <div class="toolbar">
      <input id="q" class="search" type="search" placeholder="책 · 저자 · 문장 · #키워드 검색" autocomplete="off">
      <div class="chips" id="filters"></div>
    </div>
    <div id="list" class="list"><div class="loading">서재를 불러오는 중…</div></div>
  </section>

  <!-- 책 상세 -->
  <section id="v-book" class="hidden"></section>

  <!-- 독서 연결망 · 통계 -->
  <section id="v-graph" class="hidden"></section>
  <section id="v-stats" class="hidden"></section>
  <section id="v-ai" class="hidden"></section>
  <section id="v-memo" class="hidden"></section>
  <section id="v-blist" class="hidden"></section>
  <section id="v-notes" class="hidden"></section>
  <section id="v-note" class="hidden"></section>
  <section id="v-more" class="hidden"></section>
  <section id="v-snips" class="hidden"></section>
  <section id="v-together" class="hidden"></section>
  <section id="v-pbook" class="hidden"></section>
  <section id="v-plib" class="hidden"></section>
  <section id="v-settings" class="hidden"></section>
  <section id="v-life" class="hidden"></section>
</div>

<button class="fab" id="fab" aria-label="빠르게 남기기">＋</button>
<div class="composer hidden" id="composer"><div class="wrap">
  <textarea id="ai-q" rows="1" placeholder="내 필사 · 글 · 메모에 대해 물어보세요" oninput="autoGrow(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();askAI()}"></textarea>
  <button class="btn primary" onclick="askAI()">보내기</button>
</div></div>
<nav class="nav" id="nav">
  <button data-v="library" class="on"><svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h3v16H5a1 1 0 0 1-1-1zM8 4h4v16H8M12 6.5l3.6-1 3.4 13.6-3.6 1z"/></svg>서재</button>
  <button data-v="notes"><svg viewBox="0 0 24 24"><path d="M5 20l1.2-4.2L16.5 5.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L9.2 18.8z"/><path d="M14.5 7.5l2.8 2.8M5 20h14"/></svg>노트</button>
  <button data-v="memo"><svg viewBox="0 0 24 24"><rect x="4.5" y="4" width="15" height="16" rx="2"/><path d="M8 9.5l1.5 1.5L12.5 8M8 15h8"/></svg>메모</button>
  <button data-v="graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="9" cy="18" r="2.4"/><circle cx="18" cy="18" r="1.8"/><path d="M8.2 7 15.8 7.6M7 8.3l1.4 7.4M16.4 9.8l-5.5 6.6M11.4 18h4.8"/></svg>연결망</button>
  <button data-v="more"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>더보기</button>
</nav>
<div id="modal"></div>
<div id="rec"></div>
<div id="lock"></div>
<div class="toast" id="toast"></div>

<script src="js/core.js?v=2.13"></script>
<script src="js/store-sheets.js?v=2.13"></script>
<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/store-supabase.js?v=2.13"></script>
<script src="js/store-local.js?v=2.13"></script>
<script src="js/boot.js?v=2.13"></script>
<script src="js/library-book.js?v=2.13"></script>
<script src="js/graph-stats.js?v=2.13"></script>
<script src="js/ai.js?v=2.13"></script>
<script src="js/features.js?v=2.13"></script>
<script src="js/scan-share.js?v=2.13"></script>
<script src="js/memo.js?v=2.13"></script>
<script src="js/lists-voice.js?v=2.13"></script>
<script src="js/notes.js?v=2.13"></script>
<script src="js/note-import.js?v=2.13"></script>
<script src="js/together.js?v=2.13"></script>
<script src="js/life.js?v=2.13"></script>
<script src="js/extras.js?v=2.13"></script>
<script src="js/more.js?v=2.13"></script>
</body>
</html>
