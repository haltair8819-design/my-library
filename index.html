function toastAction(msg, fn, ms = 8000) {
  const t = $('toast'); t.innerHTML = msg; t.classList.add('show'); t.style.pointerEvents = 'auto';
  clearTimeout(t._h);
  t.onclick = () => { t.classList.remove('show'); t.style.pointerEvents = ''; t.onclick = null; fn(); };
  t._h = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = ''; t.onclick = null; }, ms);
}

/* ----- 공유로 받기 ----- */
// 갤럭시 텍스트 추출 · 메모 앱에서 온 글: 화면 줄바꿈은 잇고, 문단은 살리고, 끝의 "36p"는 쪽수로
function cleanShared(meta) {
  let t = String(meta.text || '').replace(/\r/g, '');
  if (!t.trim()) t = [meta.title, meta.url].filter(Boolean).join('\n');
  let page = '';
  const m = t.match(/\n?\s*(\d{1,4}(?:\s*[,~\-]\s*\d{1,4})?)\s*p\.?\s*$/i);
  if (m) { page = m[1].replace(/\s*[~\-]\s*/, ', ').replace(/\s*,\s*/, ', '); t = t.slice(0, m.index); }
  const raw = t.trim();
  t = t.split(/\n\s*\n/).map(par => par.split('\n').map(x => x.trim()).filter(Boolean)
    .reduce((a, l) => !a ? l : /[A-Za-z]-$/.test(a) ? a.slice(0, -1) + l : a + ' ' + l, '')).filter(Boolean).join('\n\n');
  return { text: t.trim(), page, raw: /\n/.test(raw) ? raw : '' };
}
async function takeShared() {
  if (new URLSearchParams(location.search).get('share') !== '1') return;
  history.replaceState({ view: S.view, id: S.bookId || '' }, '', location.pathname);
  let meta = null; const files = [];
  try {
    const c = await caches.open('share');
    const r = await c.match(new URL('./_share/meta', location.href).href);
    if (r) {
      meta = await r.json();
      for (let i = 0; i < (meta.n || 0); i++) {
        const x = await c.match(new URL('./_share/img/' + i, location.href).href);
        if (x) { const bl = await x.blob(); files.push(new File([bl], decodeURIComponent(x.headers.get('X-Name') || 'image.jpg'), { type: bl.type || 'image/jpeg' })); }
      }
    }
    await caches.delete('share');
  } catch (e) {}
  if (!meta || (!files.length && !String(meta.text || meta.title || meta.url || '').trim())) { toast('공유받은 내용이 없어요'); return; }
  S.shared = Object.assign(cleanShared(meta), { files });
  openSharePicker('');
}
function openSharePicker(q) {
  const sh = S.shared; if (!sh) return;
  const list = pickBooks(q);
  const items = l => l.map(b => `<button class="al-item" onclick="useShared('${b.ID}')">${spine(b)}<div><b>${esc(b['제목'])}</b><span>${esc(b['저자'] || '')}${b['상태'] === '읽는중' ? ' · 읽는 중' : ''}</span></div></button>`).join('') || '<div class="al-msg">찾는 책이 없어요. 먼저 책을 추가해 주세요.</div>';
  const what = sh.files.length ? `사진 ${sh.files.length}장` : `글 ${sh.text.length.toLocaleString()}자`;
  modal(`<h3>어느 책에 넣을까요? <span style="font-weight:400;color:var(--faint);font-size:13px">공유받은 ${what}</span></h3>
    ${sh.text && !sh.files.length ? `<div class="share-peek">${esc(sh.text.slice(0, 140))}${sh.text.length > 140 ? '…' : ''}</div>` : ''}
    <input class="field" id="sp-q" type="search" placeholder="책 제목 · 저자 찾기" value="${esc(q || '')}" autocomplete="off">
    <div class="share-list" id="sp-list">${items(list)}</div>
    <div class="actions"><button class="btn" onclick="S.shared=null;closeModal()">취소</button></div>`);
  liveInput('sp-q', v => { const el = $('sp-list'); if (el) el.innerHTML = items(pickBooks(v)); });
}
function useShared(id) {
  const sh = S.shared; S.shared = null; if (!sh) return;
  closeModal(); go('book', id);
  if (sh.files.length) { scanFiles(sh.files); return; }
  openSnipForm(null);
  $('f-txt').value = sh.text; $('f-page').value = sh.page || '';
  if (navigator.onLine) { const b = document.querySelector('[data-ai-title]'); if (b) aiTitle(b, true, sh.raw); }
}

/* ----- AI 제목 ----- */
async function aiTitle(btn, auto, raw) {
  const text = $('f-txt') && $('f-txt').value.trim();
  if (!text) { toast('내용을 먼저 입력해 주세요'); return; }
  btn.disabled = true; btn.textContent = '짓는 중…';
  try {
    const r = await rpc('suggestTitle', { '책ID': S.bookId, '내용': text, raw: raw || '' });
    if (!$('f-ttl')) return;
    // 줄바꿈 정리본: 띄어쓰기만 달라졌을 때만 바꿔 넣음 (글자는 절대 안 바뀌게)
    const noWs = x => String(x || '').replace(/\s+/g, '');
    if (raw && r.text && noWs(r.text) === noWs(raw) && $('f-txt').value.trim() === text) $('f-txt').value = r.text.trim();
    if (r.title && (!auto || !$('f-ttl').value.trim())) $('f-ttl').value = r.title;
    const kw = $('f-kw');
    if (kw && r.keywords && r.keywords.length) {
      const cur = kw.value.split(',').map(x => x.trim()).filter(Boolean);
      r.keywords.forEach(k => { if (!cur.includes(k)) cur.push(k); }); kw.value = cur.join(', ');
    }
  } catch (e) { if (!auto) toast('⚠ ' + (e.message || e)); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = 'AI 제목'; } }
}


/* ----- 복사한 글 붙여넣기 (갤럭시 텍스트 추출 → 복사 → 여기 붙여넣기) ----- */
function fillPasted(txt) {
  const c = cleanShared({ text: txt });
  const ta = $('f-txt'); if (!ta || !c.text) return;
  if (!ta.value.trim()) ta.value = c.text;
  else { const a = ta.selectionStart, b = ta.selectionEnd; ta.value = ta.value.slice(0, a) + c.text + ta.value.slice(b); }
  if (c.page && !$('f-page').value.trim()) $('f-page').value = c.page;
  const btn = document.querySelector('[data-ai-title]');
  if (btn && navigator.onLine && !$('f-ttl').value.trim() && ta.value.trim() === c.text) aiTitle(btn, true, c.raw);
}
function onSnipPaste(e) {
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!txt || !/\n/.test(txt)) return;   // 한 줄짜리는 그대로 붙여넣기
  e.preventDefault(); fillPasted(txt);
}
async function pasteClip(btn) {
  try {
    const txt = await navigator.clipboard.readText();
    if (!txt.trim()) { toast('복사한 글이 없어요'); return; }
    fillPasted(txt);
  } catch (e) {
    ($('f-txt') && $('f-txt').focus());
    toast('내용 칸을 길게 눌러 붙여넣기 해 주세요');
  }
}

/* ----- 공유 받기 점검 ----- */
async function shareStatusHtml() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let mf = false;
  try { const r = await fetch('manifest.webmanifest', { cache: 'no-store' }); mf = !!(await r.json()).share_target; } catch (e) {}
  const ua = navigator.userAgent;
  const browser = /SamsungBrowser/.test(ua) ? '삼성 인터넷' : /Chrome/.test(ua) ? '크롬' : '기타 브라우저';
  const row = (ok, t, fix) => `<div class="chk ${ok ? 'ok' : 'no'}"><b>${ok ? '✓' : '✕'}</b><span>${t}${!ok && fix ? `<br><em>${fix}</em>` : ''}</span></div>`;
  return row(mf, '앱 설정에 공유 받기가 들어 있어요', 'GitHub에 manifest.webmanifest 파일을 다시 올려 주세요') +
    row(standalone, standalone ? '설치한 앱으로 열려 있어요' : '지금은 브라우저에서 열려 있어요', '홈 화면 아이콘으로 열어 주세요. 아이콘이 없으면 크롬 메뉴(⋮) → 앱 설치') +
    row(browser === '크롬', '브라우저: ' + browser, '공유 받기는 크롬으로 설치한 앱에서 가장 잘 돼요. 크롬에서 주소를 열고 메뉴(⋮) → 앱 설치');
}

/* ===================================================================
   메모 · 할 일 (v2.3)
   =================================================================== */
S.memoFilter = '전체';
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function ymd(d) { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }
function dateOf(str) { return new Date(String(str).slice(0, 10) + 'T00:00:00'); }

// "내일 3시 치과", "- 책 반납하기", "다음주 수요일까지 보고서" → { type, due, time, text }
function parseQuick(raw, forceType) {
  let t = String(raw || '').trim(), type = forceType || '', due = '', time = '';
  const today = dateOf(S.today || localToday());
  const add = n => { const d = new Date(today); d.setDate(d.getDate() + n); return ymd(d); };
  const mark = t.match(/^\s*(?:[-*•]|\[\s?\]|☐|□|할\s?일\s*[:：])\s*/);
  if (mark) { type = type || '할일'; t = t.slice(mark[0].length); }
  const cut = re => { const m = t.match(re); if (m) t = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).trim(); return m; };
  let m;
  if ((m = cut(/(오늘|내일|모레|글피)(?:\s*까지)?/))) due = add({ 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]);
  else if ((m = cut(/(이번\s?주|다음\s?주|담주)?\s*([월화수목금토일])요일(?:\s*까지)?/))) {
    const want = WD.indexOf(m[2]), cur = today.getDay();
    const mon = (cur + 6) % 7;   // 월요일 기준 오늘이 몇 번째 날
    const wantMon = (want + 6) % 7;
    let diff;
    if (!m[1]) diff = (want - cur + 7) % 7;
    else if (/이번/.test(m[1])) diff = wantMon - mon;
    else diff = 7 - mon + wantMon;
    due = add(diff);
  } else if ((m = cut(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})(?:\s*까지)?/))) due = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  else if ((m = cut(/(\d{1,2})\s*월\s*(\d{1,2})\s*일(?:\s*까지)?/)) || (m = cut(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?:\s*까지)?(?=\s|$)/))) {
    let y = today.getFullYear(); const mm = Number(m[1]), dd = Number(m[2]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
      let d = new Date(y, mm - 1, dd); if (d < today - 86400000 * 30) d = new Date(y + 1, mm - 1, dd);
      due = ymd(d);
    }
  } else if ((m = cut(/(\d{1,2})\s*일\s*(?:뒤|후)/))) due = add(Number(m[1]));
  else if ((m = cut(/(이번\s?주말|주말)/))) due = add((6 - today.getDay() + 7) % 7);
  else if ((m = cut(/다음\s?주(?:\s*까지)?/))) due = add(7 - ((today.getDay() + 6) % 7));
  if ((m = cut(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시(?!간)(?:\s*(\d{1,2})\s*분|\s*(반))?/)) || (m = cut(/(?:^|\s)()(\d{1,2}):(\d{2})(?=\s|$)/))) {
    let h = Number(m[2]), mi = Number(m[3] || (m[4] ? 30 : 0));
    if (/오후|저녁|밤/.test(m[1] || '') && h < 12) h += 12;
    if (!m[1] && h >= 1 && h <= 7) h += 12;   // "3시"는 보통 오후
    if (h <= 24 && mi < 60) { time = String(h % 24).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); if (!due) due = add(0); }
  }
  t = t.replace(/\s{2,}/g, ' ').replace(/^\s*(?:에|까지|,)\s*/, '').trim();
  const verbTodo = /(하기|할\s?것|해야\s?(?:함|해|돼)|사기|보내기|챙기기|예약|신청|반납|제출|연락|전화)[.!]?\s*$/.test(t);
  const sentence = /(다|요|네|죠|음|어|야|지)[.!?~]*\s*$/.test(t);   // "오늘 읽은 책이 좋았다" 같은 문장은 메모
  if (!type) type = (verbTodo || ((due || time) && !sentence)) ? '할일' : '메모';
  if (type === '메모') {   // 메모는 쓴 그대로 (날짜 말도 지우지 않음)
    return { type, due: '', time: '', text: String(raw || '').trim().replace(mark ? mark[0] : '', '').trim() || String(raw || '').trim() };
  }
  return { type, due, time, text: t || String(raw || '').trim() };
}
function dueLabel(due, time) {
  if (!due) return '';
  const d = dayDiff(due), wd = WD[dateOf(due).getDay()];
  const md = `${Number(due.slice(5, 7))}/${Number(due.slice(8, 10))}(${wd})`;
  const word = d === 0 ? '오늘' : d === 1 ? '내일' : d === 2 ? '모레' : d < 0 ? `${-d}일 지남` : md;
  return word + (d >= 0 && d <= 2 ? ' ' + md : '') + (time ? ' ' + time : '');
}

  });
  const nodue = sorted.filter(m => !m['마감일']);

    ${f === '끝낸 일' ? (done.length ? `<div class="todo-list">${done.map(todoRow).join('')}</div>` : '<div class="empty">아직 끝낸 일이 없어요.</div>') : ''}
    ${f === '전체' && !todos.length && !memos.length ? '<div class="empty">떠오른 생각이나 해야 할 일을 위 칸에 적어 보세요.<br>"내일 3시 치과", "- 책 반납하기"처럼 쓰면 할 일로 들어가요.</div>' : ''}`;

function quickBox(id, force) {

function bindQuick(id, after) {

    ta.style.height = 'auto'; ta.style.height = Math.min(220, ta.scrollHeight) + 'px';
    const p = parseQuick(ta.value, manual);

    $(id + '-type').classList.toggle('todo-on', p.type === '할일');
    $(id + '-due').textContent = p.type === '할일' && p.due ? dueLabel(p.due, p.time) : '';
    $(id + '-go').disabled = !ta.value.trim();
  };

/* ===================================================================
   음성 (v2.4): 🎤 받아쓰기(말하는 대로 바로) · 🎙 녹음 후 정리(Gemini)
   =================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
LONG_FNS.transcribeAudio = 1; LONG_FNS.noteAssist = 1;
let dict = null;   // 지금 받아쓰는 중인 것

// 🎤 받아쓰기: target 칸의 커서 자리에 넣음. 다시 누르면 멈춤
function toggleDictate(btn, targetId) {
  if (dict) { stopDictate(); return; }
  if (!SR) { toast('이 브라우저는 받아쓰기를 지원하지 않아요. 키보드의 🎤를 써 주세요'); return; }
  const ta = $(targetId); if (!ta) return;
  const rec = new SR();
  rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = true;
  let base = ta.value, at = ta.selectionStart ?? base.length, committed = '';
  const put = interim => {
    const glue = (s) => s && at > 0 && !/\s$/.test(base.slice(0, at)) ? ' ' + s : s;
    const mid = glue((committed + interim).trim());
    ta.value = base.slice(0, at) + mid + base.slice(at);
    ta.dispatchEvent(new Event('input'));
  };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) committed += (committed && !/\s$/.test(committed) ? ' ' : '') + t.trim();
      else interim += t;
    }
    put(interim ? (committed ? ' ' : '') + interim : '');
  };
  rec.onerror = e => { if (e.error === 'not-allowed') toast('마이크 사용을 허용해 주세요'); else if (e.error === 'network') toast('받아쓰기는 인터넷이 필요해요'); };
  rec.onend = () => { if (dict && dict.rec === rec && dict.keep) { try { rec.start(); } catch (err) { stopDictate(); } } };   // 말을 멈추면 끊기는 것 이어 붙이기
  dict = { rec, btn, keep: true };
  btn.classList.add('rec-on'); btn.setAttribute('aria-pressed', 'true');
  try { rec.start(); toast('말하세요. 다시 누르면 멈춰요'); } catch (e) { stopDictate(); }
}
function stopDictate() {
  if (!dict) return;
  const d = dict; dict = null; d.keep = false;
  try { d.rec.stop(); } catch (e) {}
  d.btn.classList.remove('rec-on'); d.btn.setAttribute('aria-pressed', 'false');
}

/* ----- 🎙 녹음 → WAV(16kHz) → Gemini 정리 ----- */
const REC_MAX_SEC = 300;
let recr = null;
async function startRecording(mode, onDone) {
  stopDictate();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('이 기기에서는 녹음을 할 수 없어요'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } }); }
  catch (e) { toast('마이크 사용을 허용해 주세요'); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx; try { ctx = new AC({ sampleRate: 16000 }); } catch (e) { ctx = new AC(); }
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = []; let level = 0;
  proc.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let s = 0; for (let i = 0; i < d.length; i += 16) s = Math.max(s, Math.abs(d[i])); level = s;
  };
  src.connect(proc); proc.connect(ctx.destination);
  recr = { stream, ctx, proc, src, chunks, mode, onDone, t0: Date.now(), rate: ctx.sampleRate };
  const label = { memo: '말한 내용을 메모로 정리해요. 할 일이 있으면 따로 뽑아요.', snip: '책 문장을 읽어 주세요. "48쪽"처럼 쪽수도 말하면 쪽수 칸에 넣어요.', note: '말한 그대로 글로 옮겨요.' }[mode] || '';
  $('rec').innerHTML = `<div class="rec-sheet" role="dialog" aria-label="녹음 중">
    <div class="rec-top"><span class="rec-dot"></span><b id="rec-t">0:00</b><span class="small">최대 5분</span></div>
    <div class="rec-bar"><i id="rec-lv"></i></div>
    <div class="small" style="margin:8px 0 14px;line-height:1.55">${label}</div>
    <div class="actions" style="margin:0"><button class="btn" onclick="cancelRecording()">취소</button>
      <button class="btn primary grow" onclick="finishRecording()">녹음 끝 · 정리하기</button></div></div>`;
  recr.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - recr.t0) / 1000);
    const t = $('rec-t'); if (t) t.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    const lv = $('rec-lv'); if (lv) lv.style.width = Math.min(100, level * 260) + '%';
    if (sec >= REC_MAX_SEC) finishRecording();
  }, 200);
}
function endRecorder() {
  const r = recr; recr = null; if (!r) return null;
  clearInterval(r.timer);
  try { r.proc.disconnect(); r.src.disconnect(); } catch (e) {}
  r.stream.getTracks().forEach(t => t.stop());
  try { r.ctx.close(); } catch (e) {}
  $('rec').innerHTML = '';
  return r;
}
function cancelRecording() { endRecorder(); toast('녹음을 지웠어요'); }
async function finishRecording() {
  const r = endRecorder(); if (!r) return;
  const wav = encodeWav(r.chunks, r.rate, 16000);
  if ((Date.now() - r.t0) < 800) { toast('녹음이 너무 짧아요'); return; }
  if (!navigator.onLine) {
    await voiceQueueAdd(wav, r.mode);
    toast('인터넷이 연결되면 메모로 정리해 둘게요');
    return;
  }
  await transcribeWav(wav, r.mode, r.onDone);
}
async function transcribeWav(wav, mode, onDone) {
  const b64 = await blobToB64(wav);
  showBusy('녹음을 글로 옮기는 중… (10~40초)');
  try {
    const res = await rpc('transcribeAudio', { audio: b64, mime: 'audio/wav', mode });
    hideBusy();
    if (onDone) onDone(res); else voiceToMemo(res);
  } catch (e) {
    hideBusy();
    if (e.network) { await voiceQueueAdd(wav, mode); toast('연결이 끊겨 녹음을 보관했어요. 연결되면 메모로 정리해요'); }
    else toast('⚠ ' + (e.message || e));
  }
}

// 16kHz 모노 16비트 WAV로 (Gemini가 읽을 수 있는 형식)
function encodeWav(chunks, inRate, outRate) {
  let len = chunks.reduce((t, c) => t + c.length, 0);
  const pcm = new Float32Array(len); let o = 0; chunks.forEach(c => { pcm.set(c, o); o += c.length; });
  let data = pcm;
  if (inRate !== outRate) {
    const ratio = inRate / outRate, n = Math.floor(pcm.length / ratio); data = new Float32Array(n);
    for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(pcm.length, Math.floor((i + 1) * ratio)); let s = 0; for (let j = a; j < b; j++) s += pcm[j]; data[i] = s / Math.max(1, b - a); }
  }
  const buf = new ArrayBuffer(44 + data.length * 2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, outRate, true);
  v.setUint32(28, outRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, data.length * 2, true);
  for (let i = 0; i < data.length; i++) { const s = Math.max(-1, Math.min(1, data[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
function blobToB64(blob) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); }); }

let voiceBusy = false;
async function processVoiceQueue() {
  if (voiceBusy || !navigator.onLine || !API.url) return;
  const q = (await IDB.get('voiceq')) || []; if (!q.length) return;

/* ----- 쓰기 도구 ----- */
function mdWrap(pre, post) {
  const ta = $('ne-body'); if (!ta) return;
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  if (!post) {   // 줄 앞에 붙이기 (선택한 줄 모두)
    const ls = v.lastIndexOf('\n', a - 1) + 1, le = v.indexOf('\n', b); const end = le < 0 ? v.length : le;
    const block = v.slice(ls, end).split('\n').map(l => l.startsWith(pre) ? l.slice(pre.length) : pre + l).join('\n');
    ta.value = v.slice(0, ls) + block + v.slice(end); ta.setSelectionRange(ls, ls + block.length);
  } else {
    const sel = v.slice(a, b) || '굵게';
    ta.value = v.slice(0, a) + pre + sel + post + v.slice(b); ta.setSelectionRange(a + pre.length, a + pre.length + sel.length);
  }
  ta.focus(); ta.dispatchEvent(new Event('input'));
}
function insertAtCursor(text) {
  const ta = $('ne-body'); if (!ta) return;
  const a = ta.selectionStart ?? ta.value.length, v = ta.value;
  const pre = a > 0 && v[a - 1] !== '\n' ? '\n\n' : '';
  ta.value = v.slice(0, a) + pre + text + '\n' + v.slice(a);
  const p = a + pre.length + text.length + 1; ta.setSelectionRange(p, p); ta.focus(); ta.dispatchEvent(new Event('input'));
}
function recNoteDone(res) {
  if ($('ne-body')) { insertAtCursor(res.text); if (res.title && $('ne-title') && !$('ne-title').value.trim()) $('ne-title').value = res.title; noteChanged(); }
  else voiceToMemo(res);
}
function quoteBlock(s) {
  const b = book(s['책ID']) || {};
  return sText(s).trim().split('\n').map(l => '> ' + l).join('\n') + `\n> — 『${b['제목'] || ''}』${s['쪽수'] !== '' && s['쪽수'] != null ? ', p.' + s['쪽수'] : ''}`;
}

/* ----- 연결된 필사: 쓰는 글과 맞는 내 필사 ----- */
function relatedSnips(n, limit) {
  const text = (String(n['제목']) + ' ' + String(n['본문'])).toLowerCase();
  const kws = splitKw(n['키워드']);
  const linked = [...String(n['본문']).matchAll(/\[\[(.+?)\]\]/g)].map(m => m[1].trim());
  const linkedBooks = new Set(S.books.filter(b => linked.some(t => normT(b['제목']) === normT(t))).map(b => b.ID));
  const words = uniq((text.match(/[가-힣a-z]{2,}/g) || []).map(w => w.replace(/(은|는|이|가|을|를|에|의|와|과|도|로|으로|에서|에게|까지|부터|처럼|이다|했다|한다|하는|하고)$/, '')).filter(w => w.length >= 2)).slice(0, 80);
  const T = topicData();
  const scored = S.snips.map(s => {
    const sk = splitKw(s['키워드']); let sc = 0;
    kws.forEach(k => { if (sk.includes(k)) sc += 6; });
    sk.forEach(k => { if (text.includes(k.toLowerCase())) sc += 3; });
    if (linkedBooks.has(s['책ID'])) sc += 5;
    const body = String(s['내용']).toLowerCase();
    let hit = 0; words.forEach(w => { if (w.length >= 2 && body.includes(w) && !(T.cnt[w] > 120)) hit++; });
    sc += Math.min(6, hit);
    if (String(n['본문']).includes(String(s['내용']).slice(0, 30))) sc = -1;   // 이미 넣은 문장
    return { s, sc };
  }).filter(x => x.sc >= 3).sort((a, b) => b.sc - a.sc);
  return scored.slice(0, limit || 30).map(x => x.s);
}
function relListHtml(n, q) {
  const qq = String(q || '').trim().toLowerCase();
  const terms = qq.replace(/^#/, '').split(/\s+/).filter(Boolean);
  const list = qq ? S.snips.filter(s => { const hay = (s['내용'] + ' ' + s['제목'] + ' ' + s['키워드'] + ' ' + ((book(s['책ID']) || {})['제목'] || '')).toLowerCase(); return terms.every(t => hay.includes(t)); }).slice(0, 40) : relatedSnips(n, 30);
  const sub = $('rel-sub'); if (sub) sub.textContent = qq ? `찾은 문장 ${list.length}${list.length >= 40 ? '+' : ''}` : '쓰는 글과 맞는 내 필사';
  return list.map(s => { const b = book(s['책ID']) || {}; return `<button class="mini" onclick="insertSnip('${s.ID}')">
      <b>${esc(s['제목'] || b['제목'] || '')}</b><span>${esc(sText(s).slice(0, 140))}${sText(s).length > 140 ? '…' : ''}</span>
      <em>${esc(b['제목'] || '')}${s['쪽수'] !== '' && s['쪽수'] != null ? ' · p.' + esc(s['쪽수']) : ''} · 누르면 인용으로 넣어요</em></button>`; }).join('') || `<div class="al-msg">${qq ? '찾는 문장이 없어요' : '아직 이어지는 필사가 없어요. 키워드를 달거나 몇 문장 더 쓰면 찾아줘요.'}</div>`;
}

/* ----- [[링크]] ----- */
const normT = t => String(t || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^0-9a-z가-힣]/g, '');
function resolveLink(t) {
  const k = normT(t);
  const b = S.books.find(x => normT(x['제목']) === k) || S.books.find(x => k.length >= 3 && normT(x['제목']).startsWith(k));
  if (b) return { kind: 'book', id: b.ID };
  const n = S.notes.find(x => normT(x['제목']) === k);
  if (n) return { kind: 'note', id: n.ID };
  return null;
}
function openLink(t) {

}
function linkListHtml(q) {

}

// 이 글 · 이 책을 [[ ]]로 언급한 글
function notesLinkingHere(target) {
  const names = target['본문'] !== undefined ? [target['제목']] : [target['제목']];
  const keys = names.map(normT).filter(Boolean);
  if (!keys.length) return [];

/* ----- 읽기 화면: 가벼운 마크다운 ----- */
function renderMd(t) {
  const lines = esc(String(t || '')).split('\n');
  let html = '', list = false, quote = [];
  const flushQ = () => { if (quote.length) { html += `<blockquote>${quote.join('<br>')}</blockquote>`; quote = []; } };
  const closeL = () => { if (list) { html += '</ul>'; list = false; } };
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^&gt;\s?(.*)$/))) { closeL(); quote.push(m[1]); return; }
    flushQ();
    if ((m = l.match(/^#{1,3}\s+(.*)$/))) { closeL(); html += `<h2>${m[1]}</h2>`; }
    else if ((m = l.match(/^\s*[-•]\s+(.*)$/))) { if (!list) { html += '<ul>'; list = true; } html += `<li>${m[1]}</li>`; }
    else if (!l.trim()) { closeL(); }
    else { closeL(); html += `<p>${l}</p>`; }
  });
  flushQ(); closeL();
  return html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[\[(.+?)\]\]/g, (all, t) => `<a class="wlink ${resolveLink(t.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&')) ? '' : 'dead'}" onclick="openLink(this.dataset.t)" data-t="${t}">${t}</a>`);
}

      <button class="btn" style="margin-top:8px" onclick="navigator.clipboard.writeText(${esc(JSON.stringify((r.summary || '') + '\n' + (r.tags || []).map(t => '#' + String(t).replace(/^#/, '')).join(' ')))}).then(()=>toast('복사했어요'))">복사</button>`;

}

async function copyNote(kind) {

async function noteKw(btn) {

/* ===================================================================
   통합 검색: 책 · 필사 · 글 · 메모 (서재 검색칸)

function otherHitsHtml(q) {
  q = String(q || '').trim().toLowerCase(); if (!q) return '';
  const kw = q.startsWith('#') ? q.slice(1) : '';
  const terms = (kw ? [kw] : q.split(/\s+/)).filter(Boolean);
  const has = t => terms.every(w => t.toLowerCase().includes(w));
  const notes = S.notes.filter(n => kw ? splitKw(n['키워드']).some(k => k.toLowerCase() === kw) : has(n['제목'] + ' ' + n['본문'] + ' ' + n['키워드'])).slice(0, 10);
  const memos = kw ? [] : S.memos.filter(m => has(m['내용'])).slice(0, 10);
  let h = '';
  if (notes.length) h += `<div class="res-head">내 글 ${notes.length}편</div>` + notes.map(n => `<div class="hit" onclick="openNote('${n.ID}')"><div class="ht">✍ ${esc(n['제목'] || '제목 없음')}</div>
    <div class="hx">${highlight(plainText(n['본문']), q)}</div><div class="hm">${esc(n['상태'])} · ${esc(String(n['수정일'] || '').slice(0, 10))}</div></div>`).join('');
  if (memos.length) h += `<div class="res-head">메모 · 할 일 ${memos.length}개</div>` + memos.map(m => `<div class="hit" onclick="go('memo');setTimeout(()=>openMemo('${m.ID}'),60)"><div class="hx">${m['종류'] === '할일' ? '☑ ' : '✎ '}${highlight(String(m['내용']), q)}</div></div>`).join('');
  return h;
}

/* ===================================================================
   전체 내보내기: 마크다운 파일 묶음(zip) — 옵시디언 등에서 그대로 열림
   =================================================================== */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {   // files: [{name, text}] → Blob (압축 없이 묶기)
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const now = new Date(), dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)), dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate());
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((t, p) => t + (p.byteLength || p.length), 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: 'application/zip' });
}
function safeName(t) { return String(t || '제목 없음').replace(/[\\/:*?"<>|#\[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || '제목 없음'; }
function exportMarkdown() {
  const files = [], used = {};
  const uniqName = p => { let n = p, i = 2; while (used[n]) n = p.replace(/\.md$/, ` (${i++}).md`); used[n] = 1; return n; };
  S.books.forEach(b => {
    const sn = snipsOf(b.ID);
    const meta = [['저자', b['저자']], ['옮긴이', b['옮긴이']], ['출판사', b['출판사']], ['상태', b['상태']], ['시작일', b['시작일']], ['완독일', b['완독일']], ['분량', b['분량'] ? b['분량'] + '쪽' : ''], ['분류', [b['대분류'], b['중분류'], b['개인분류']].filter(Boolean).join(' > ')], ['별점', b['별점'] ? '★'.repeat(Number(b['별점'])) : ''], ['한줄평', b['한줄평']]].filter(x => x[1]);
    const body = `# ${b['제목']}\n\n${meta.map(([k, v]) => `- ${k}: ${v}`).join('\n')}\n\n## 필사 (${sn.length})\n\n` +
      sn.map(s => `### ${s['제목'] || '(제목 없음)'}${s['쪽수'] !== '' && s['쪽수'] != null ? ` · p.${s['쪽수']}` : ''}\n\n${s['유형'] === '인용' ? sText(s).split('\n').map(l => '> ' + l).join('\n') + (sMemo(s) ? '\n\n메모: ' + sMemo(s) : '') : s['내용']}\n${s['키워드'] ? '\n' + splitKw(s['키워드']).map(k => '#' + k.replace(/\s/g, '_')).join(' ') + '\n' : ''}`).join('\n');
    files.push({ name: uniqName(`책/${safeName(b['제목'])}.md`), text: body });
  });
  S.notes.forEach(n => files.push({ name: uniqName(`노트/${safeName(n['제목'])}.md`), text: `---\n상태: ${n['상태']}\n묶음: ${n['묶음'] || ''}\n키워드: ${n['키워드'] || ''}\n작성일: ${n['작성일'] || ''}\n수정일: ${n['수정일'] || ''}\n발행링크: ${n['발행링크'] || ''}\n---\n\n# ${n['제목'] || ''}\n\n${n['본문']}\n` }));
  const todos = S.memos.filter(m => m['종류'] === '할일'), memos = S.memos.filter(m => m['종류'] !== '할일');
  files.push({ name: '메모.md', text: `# 메모\n\n${memos.map(m => `- (${m['작성일'] || ''}) ${String(m['내용']).replace(/\n/g, ' ')}`).join('\n')}\n\n# 할 일\n\n${todos.map(m => `- [${isDone(m) ? 'x' : ' '}] ${m['내용']}${m['마감일'] ? ` (마감 ${String(m['마감일']).slice(0, 10)}${m['마감시간'] ? ' ' + m['마감시간'] : ''})` : ''}`).join('\n')}\n` });
  const blob = makeZip(files);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `나의서재_백업_${S.today}.zip`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast(`책 ${S.books.length} · 글 ${S.notes.length} · 메모 파일로 내보냈어요`);
}

/* ===================================================================
   앱 잠금 (이 기기에서만, 비밀번호 4~8자리 숫자)
   =================================================================== */
async function pinHash(p) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('my-library:' + p));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function openLockSettings() {
  const on = !!LS.get('pin_hash');
  modal(`<h3>앱 잠금</h3>
    <div class="small" style="line-height:1.6;margin-bottom:8px">앱을 열 때와, 1분 넘게 다른 앱을 쓰다 돌아올 때 비밀번호를 물어요. 이 기기에만 적용돼요.</div>
    ${on ? `<div class="actions"><button class="btn danger" onclick="pinOff()">잠금 끄기</button><button class="btn grow" onclick="pinSetup()">비밀번호 바꾸기</button></div>`
      : `<div class="actions"><button class="btn primary grow" onclick="pinSetup()">잠금 켜기</button></div>`}
    <div class="actions"><button class="btn grow" onclick="closeModal()">닫기</button></div>`);
}
function pinSetup() {
  modal(`<h3>새 비밀번호</h3><div class="small">숫자 4~8자리</div>
    <input class="field pin-in" id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="비밀번호">
    <input class="field pin-in" id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="한 번 더" style="margin-top:8px">
    <div class="small" style="margin-top:8px;color:var(--faint)">잊어버리면 이 기기의 저장 데이터를 지우고 서버 연결 키를 다시 넣어야 해요. 시트의 기록은 그대로예요.</div>
    <div class="actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary grow" onclick="pinSave()">저장</button></div>`);
  setTimeout(() => ($('pin1') && $('pin1').focus()), 50);
}
async function pinSave() {
  const a = $('pin1').value, b = $('pin2').value;
  if (!/^\d{4,8}$/.test(a)) { toast('숫자 4~8자리로 정해 주세요'); return; }
  if (a !== b) { toast('두 번 넣은 비밀번호가 달라요'); return; }
  LS.set('pin_hash', await pinHash(a)); closeModal(); toast('잠금을 켰어요'); if (S.view === 'more') renderMoreView();
}
function pinOff() { LS.del('pin_hash'); closeModal(); toast('잠금을 껐어요'); if (S.view === 'more') renderMoreView(); }
let lockedAt = 0, hiddenAt = 0;
function showLock() {
  if (!LS.get('pin_hash') || $('lock').innerHTML) return;
  lockedAt = Date.now();
  $('lock').innerHTML = `<div class="lock"><div class="lock-box"><div class="lock-ic">🔒</div><b>나의 서재</b>
    <input class="field pin-in" id="pin-try" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="비밀번호">
    <div class="small" id="pin-msg" style="min-height:1.4em;margin-top:6px"></div>
    <button class="btn primary" style="width:100%" onclick="tryPin()">열기</button>
    <button class="iconbtn" style="margin-top:14px;font-size:12.5px" onclick="forgotPin()">비밀번호를 잊었어요</button></div></div>`;
  const i = $('pin-try'); i.oninput = () => { if (i.value.length >= 4) tryPin(true); }; i.onkeydown = e => { if (e.key === 'Enter') tryPin(); };
  setTimeout(() => i.focus(), 50);
}
async function tryPin(quiet) {
  const v = $('pin-try').value;
  if (await pinHash(v) === LS.get('pin_hash')) { $('lock').innerHTML = ''; return; }
  if (!quiet || v.length >= 8) { $('pin-msg').textContent = '비밀번호가 달라요'; $('pin-try').value = ''; }
}
function forgotPin() {
  if (!confirm('이 기기의 저장 데이터와 연결 정보를 지우고 잠금을 풀까요?\n시트의 기록은 그대로이고, 서버 연결 키를 다시 넣으면 돼요.')) return;
  LS.del('pin_hash'); LS.del('api_url'); LS.del('api_key'); LS.del(OUTBOX_KEY); IDB.del(CACHE_KEY).then(() => location.reload());
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000) showLock();
});
